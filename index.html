<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навчальний портал — ДФКР</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --dark-bg: #0f172a;
            --body-bg: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--body-bg);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Шапка сайту */
        header {
            background-color: var(--dark-bg);
            color: #ffffff;
            padding: 24px 0;
            margin-bottom: 30px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 { font-size: 1.6rem; font-weight: 700; }
        .header-title p { opacity: 0.8; font-size: 0.9rem; }

        .admin-btn {
            color: #ffffff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: background 0.2s;
        }

        .admin-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* Блок Портфоліо */
        .portfolio-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 35px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .teacher-avatar {
            font-size: 3.5rem;
            background: #e0f2fe;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
        }

        .portfolio-info { flex: 1; min-width: 250px; }
        .portfolio-info h2 { font-size: 1.4rem; color: var(--dark-bg); }
        .portfolio-info .role { color: var(--primary-color); font-weight: 700; margin-bottom: 8px; }
        .portfolio-details p { font-size: 0.92rem; color: var(--text-muted); margin-top: 4px; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .tag {
            background: #f1f5f9;
            color: var(--dark-bg);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        /* Заголовки секцій */
        .section-title {
            font-size: 1.3rem;
            color: var(--dark-bg);
            margin-bottom: 18px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
        }

        /* Сітка дисциплін */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .subject-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .subject-icon { font-size: 1.8rem; }
        .subject-title { font-size: 1.1rem; font-weight: 700; }
        .subject-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; }

        /* Стилі кнопок документів (Силабуси / Програми) */
        .subject-docs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .doc-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background-color: #f1f5f9;
            color: var(--dark-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .doc-link-btn:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* Пошук та Лекції */
        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input, .filter-select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background: #fff;
            outline: none;
        }

        .search-input { flex-grow: 1; }
        .search-input:focus, .filter-select:focus { border-color: var(--primary-color); }

        .lessons-list { display: flex; flex-direction: column; gap: 15px; }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .lesson-title { font-size: 1.05rem; font-weight: 700; }

        .badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-discipline { background: #e2e8f0; color: #334155; }
        .badge-type { background: #e0f2fe; color: #0369a1; }

        .lesson-body { font-size: 0.92rem; color: #334155; margin-bottom: 12px; }

        .lesson-file-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-color);
            text-decoration: none;
        }

        .lesson-file-link:hover { background: var(--primary-color); color: #fff; }

        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="header-title">
                <h1>🎓 Навчальний портал викладача</h1>
                <p>Дніпровський фаховий коледж радіоелектроніки</p>
            </div>
            <a href="admin.html" class="admin-btn">⚙️ Вхід в Адмінку</a>
        </div>
    </header>

    <div class="container">

        <!-- 👨‍🏫 ПОРТФОЛІО ВИКЛАДАЧА -->
        <section id="portfolio-section" class="portfolio-card">
            <div class="teacher-avatar" id="p-avatar">👨‍🏫</div>
            <div class="portfolio-info">
                <h2 id="p-name">Завантаження...</h2>
                <div class="role" id="p-role"></div>
                <div class="portfolio-details">
                    <p id="p-education"></p>
                    <p id="p-interests"></p>
                    <p id="p-contacts"></p>
                </div>
                <div class="tags-container" id="p-disciplines-tags"></div>
            </div>
        </section>

        <!-- 📚 ДИСЦИПЛІНИ З СИЛАБУСАМИ -->
        <section>
            <h2 class="section-title">📚 Навчальні Дисципліни</h2>
            <div class="subjects-grid" id="subjects-container">
                <div class="empty-state">Завантаження дисциплін...</div>
            </div>
        </section>

        <!-- 📝 ЛЕКЦІЇ ТА МАТЕРІАЛИ -->
        <section>
            <h2 class="section-title">📝 Навчальні Матеріали та Завдання</h2>

            <div class="controls-bar">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Пошук за темою..." oninput="filterLessons()">
                <select id="filter-discipline" class="filter-select" onchange="filterLessons()">
                    <option value="">Всі дисципліни</option>
                </select>
            </div>

            <div class="lessons-list" id="lessons-container">
                <div class="empty-state">Завантаження матеріалів...</div>
            </div>
        </section>

    </div>

    <script>
        const SANITY_PROJECT_ID = "uld9o5j2";
        const SANITY_DATASET = "production";

        let allSubjects = [];
        let allLessons = [];

        document.addEventListener('DOMContentLoaded', loadPortalData);

        async function loadPortalData() {
            const ts = Date.now(); // Запобігаємо кешуванню браузером

            // 1. Завантаження Портфоліо
            try {
                const pRes = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "portfolio"][0]')}&_ts=${ts}`);
                const pData = await pRes.json();
                if (pData.result) renderPortfolio(pData.result);
            } catch (err) {
                console.error("Помилка завантаження портфоліо:", err);
            }

            // 2. Завантаження Дисциплін (з підтримкою як лінків, так і завантажених PDF-файлів Sanity)
            try {
                const sGROQ = `*[_type == "subject"]{
                    ...,
                    "syllabusUrl": select(defined(syllabusUrl) => syllabusUrl, defined(syllabus.asset) => syllabus.asset->url, null),
                    "workProgramUrl": select(defined(workProgramUrl) => workProgramUrl, defined(workProgram.asset) => workProgram.asset->url, null),
                    "studyProgramUrl": select(defined(studyProgramUrl) => studyProgramUrl, defined(studyProgram.asset) => studyProgram.asset->url, null)
                }`;
                const sRes = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent(sGROQ)}&_ts=${ts}`);
                const sData = await sRes.json();
                allSubjects = sData.result || [];
                renderSubjects(allSubjects);
                populateDisciplineFilter(allSubjects);
            } catch (err) {
                console.error("Помилка завантаження дисциплін:", err);
            }

            // 3. Завантаження Лекцій та матеріалів
            try {
                const lGROQ = `*[_type == "lesson"]{
                    ...,
                    "fileUrl": select(defined(fileUrl) => fileUrl, defined(file.asset) => file.asset->url, null)
                }`;
                const lRes = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent(lGROQ)}&_ts=${ts}`);
                const lData = await lRes.json();
                allLessons = lData.result || [];
                renderLessons(allLessons);
            } catch (err) {
                console.error("Помилка завантаження лекцій:", err);
            }
        }

        // РЕНДЕР ПОРТФОЛІО
        function renderPortfolio(p) {
            document.getElementById('p-avatar').innerText = p.avatar || '👨‍🏫';
            document.getElementById('p-name').innerText = p.name || 'Викладач';
            document.getElementById('p-role').innerText = p.role || 'Викладач спецдисциплін';
            
            document.getElementById('p-education').innerText = p.education ? '🎓 ' + p.education : '';
            document.getElementById('p-interests').innerText = p.interests ? '🔬 Інтереси: ' + p.interests : '';
            document.getElementById('p-contacts').innerText = p.contacts ? '📬 Контакти: ' + p.contacts : '';

            const tagsContainer = document.getElementById('p-disciplines-tags');
            if (p.disciplines && Array.isArray(p.disciplines)) {
                tagsContainer.innerHTML = p.disciplines.map(d => `<span class="tag">${escapeHTML(d)}</span>`).join('');
            } else {
                tagsContainer.innerHTML = '';
            }
        }

        // РЕНДЕР ДИСЦИПЛІН ТА КНОПОК
        function renderSubjects(subjects) {
            const container = document.getElementById('subjects-container');
            if (!subjects || subjects.length === 0) {
                container.innerHTML = '<div class="empty-state">Дисципліни ще не додані.</div>';
                return;
            }

            container.innerHTML = subjects.map(s => {
                const hasDocs = s.syllabusUrl || s.workProgramUrl || s.studyProgramUrl;

                return `
                    <div class="subject-card">
                        <div>
                            <div class="subject-header">
                                <span class="subject-icon">${s.icon || '📚'}</span>
                                <h3 class="subject-title">${escapeHTML(s.title)}</h3>
                            </div>
                            <p class="subject-desc">${escapeHTML(s.desc || '')}</p>
                        </div>

                        ${hasDocs ? `
                            <div class="subject-docs">
                                ${s.syllabusUrl ? `<a href="${escapeAttr(s.syllabusUrl)}" target="_blank" rel="noopener" class="doc-link-btn">📄 Силабус</a>` : ''}
                                ${s.workProgramUrl ? `<a href="${escapeAttr(s.workProgramUrl)}" target="_blank" rel="noopener" class="doc-link-btn">📋 Робоча програма</a>` : ''}
                                ${s.studyProgramUrl ? `<a href="${escapeAttr(s.studyProgramUrl)}" target="_blank" rel="noopener" class="doc-link-btn">🎓 Навчальна програма</a>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // РЕНДЕР ЛЕКЦІЙ
        function renderLessons(lessons) {
            const container = document.getElementById('lessons-container');
            if (!lessons || lessons.length === 0) {
                container.innerHTML = '<div class="empty-state">Матеріалів не знайдено.</div>';
                return;
            }

            container.innerHTML = lessons.map(l => `
                <div class="lesson-card">
                    <div class="lesson-header">
                        <h3 class="lesson-title">${escapeHTML(l.title)}</h3>
                        <div class="badges">
                            ${l.discipline ? `<span class="badge badge-discipline">${escapeHTML(l.discipline)}</span>` : ''}
                            ${l.taskType ? `<span class="badge badge-type">${escapeHTML(l.taskType)}</span>` : ''}
                        </div>
                    </div>

                    ${l.content ? `<div class="lesson-body">${l.content}</div>` : ''}

                    ${l.fileUrl ? `
                        <a href="${escapeAttr(l.fileUrl)}" target="_blank" rel="noopener" class="lesson-file-link">
                            📎 Завантажити / Відкрити файл
                        </a>
                    ` : ''}
                </div>
            `).join('');
        }

        // ФІЛЬТРАЦІЯ
        function filterLessons() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedDiscipline = document.getElementById('filter-discipline').value;

            const filtered = allLessons.filter(l => {
                const matchesSearch = !query || (l.title && l.title.toLowerCase().includes(query)) || (l.content && l.content.toLowerCase().includes(query));
                const matchesDiscipline = !selectedDiscipline || l.discipline === selectedDiscipline;
                return matchesSearch && matchesDiscipline;
            });

            renderLessons(filtered);
        }

        function populateDisciplineFilter(subjects) {
            const select = document.getElementById('filter-discipline');
            select.innerHTML = '<option value="">Всі дисципліни</option>' + 
                subjects.map(s => `<option value="${escapeAttr(s.title)}">${escapeHTML(s.title)}</option>`).join('');
        }

        // Безпечний вивід HTML
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
