<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навчальний портал — ДФКР</title>
    <style>
        :root {
            --deep-blue: #0f172a;
            --bright-blue: #0284c7;
            --bright-blue-hover: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Шапка сайту */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(15,23,42,0.15);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 { font-size: 1.8rem; font-weight: 800; }
        .header-title p { opacity: 0.8; font-size: 0.95rem; margin-top: 4px; }

        .admin-link {
            color: #e0f2fe;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s;
        }

        .admin-link:hover { background: rgba(255,255,255,0.2); }

        /* Блок Портфоліо */
        .portfolio-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 35px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 25px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .portfolio-card { grid-template-columns: 1fr; text-align: center; }
        }

        .teacher-avatar {
            width: 100px;
            height: 100px;
            background: #e0f2fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin: 0 auto;
            border: 2px solid var(--bright-blue);
        }

        .portfolio-info h2 { font-size: 1.5rem; color: var(--deep-blue); }
        .portfolio-info .role { color: var(--bright-blue); font-weight: 700; margin-bottom: 10px; }
        .portfolio-details { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 12px; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .tag {
            background: #f1f5f9;
            color: var(--deep-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Розділи сторінки */
        .section-title {
            font-size: 1.4rem;
            color: var(--deep-blue);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ДИСЦИПЛІНИ (СІТКА КАРТОК) */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 45px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .subject-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .subject-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .subject-icon { font-size: 2rem; }
        .subject-title { font-size: 1.15rem; font-weight: 700; color: var(--deep-blue); }
        .subject-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 18px; flex-grow: 1; }

        /* КНОПКИ ДОКУМЕНТІВУ КАРТЦІ ДИСЦИПЛІНИ */
        .subject-docs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
        }

        .doc-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background-color: #f1f5f9;
            color: var(--deep-blue);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .doc-link-btn:hover {
            background-color: var(--bright-blue);
            color: #ffffff;
            border-color: var(--bright-blue);
        }

        /* ПОШУК ТА ФІЛЬТРИ ЛЕКЦІЙ */
        .controls-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-input, .filter-select {
            padding: 11px 15px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: white;
            outline: none;
        }

        .search-input { flex-grow: 1; }
        .search-input:focus, .filter-select:focus { border-color: var(--bright-blue); }

        /* СПИСОК ЛЕКЦІЙ */
        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            transition: border-color 0.2s;
        }

        .lesson-card:hover { border-color: var(--bright-blue); }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 10px;
        }

        .lesson-title { font-size: 1.1rem; font-weight: 700; color: var(--deep-blue); }

        .badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-discipline { background: #e2e8f0; color: #334155; }
        .badge-type { background: #e0f2fe; color: #0369a1; }

        .lesson-body {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 15px;
        }

        .lesson-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
        }

        .lesson-file-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--bright-blue);
            text-decoration: none;
            transition: all 0.2s;
        }

        .lesson-file-link:hover {
            background: var(--bright-blue);
            color: white;
            border-color: var(--bright-blue);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="header-title">
                <h1>🎓 Навчальний портал викладача</h1>
                <p>Дніпровський фаховий коледж радіоелектроніки</p>
            </div>
            <a href="admin.html" class="admin-link">⚙️ Вхід в Адмінку</a>
        </div>
    </header>

    <div class="container">

        <!-- 👨‍🏫 ПОРТФОЛІО ВИКЛАДАЧА -->
        <section id="portfolio-section" class="portfolio-card">
            <div class="teacher-avatar" id="p-avatar">👨‍🏫</div>
            <div class="portfolio-info">
                <h2 id="p-name">Завантаження...</h2>
                <div class="role" id="p-role">Завантаження інформації...</div>
                
                <div class="portfolio-details">
                    <p id="p-education"></p>
                    <p id="p-interests" style="margin-top: 4px;"></p>
                    <p id="p-contacts" style="margin-top: 4px; font-weight: 600; color: var(--deep-blue);"></p>
                </div>

                <div class="tags-container" id="p-disciplines-tags"></div>
            </div>
        </section>

        <!-- 📚 ДИСЦИПЛІНИ З СИЛАБУСАМИ ТА ПРОГРАМАМИ -->
        <section>
            <h2 class="section-title">📚 Навчальні Дисципліни</h2>
            <div class="subjects-grid" id="subjects-container">
                <div class="empty-state">Завантаження дисциплін...</div>
            </div>
        </section>

        <!-- 📝 ЛЕКЦІЇ ТА МАТЕРІАЛИ -->
        <section>
            <h2 class="section-title">📝 Навчальні Матеріали та Завдання</h2>

            <!-- Панель фільтрів -->
            <div class="controls-bar">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Пошук за темою матеріалу..." oninput="filterLessons()">
                <select id="filter-discipline" class="filter-select" onchange="filterLessons()">
                    <option value="">Всі дисципліни</option>
                </select>
            </div>

            <div class="lessons-list" id="lessons-container">
                <div class="empty-state">Завантаження матеріалів...</div>
            </div>
        </section>

    </div>

    <script>
        const SANITY_PROJECT_ID = "uld9o5j2";
        const SANITY_DATASET = "production";

        let allSubjects = [];
        let allLessons = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadPortalData();
        });

        async function loadPortalData() {
            try {
                // 1. Завантаження Портфоліо
                const pRes = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "portfolio"][0]')}`);
                const pData = await pRes.json();
                if (pData.result) renderPortfolio(pData.result);

                // 2. Завантаження Дисциплін
                const sRes = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "subject"]')}`);
                const sData = await sRes.json();
                allSubjects = sData.result || [];
                renderSubjects(allSubjects);
                populateDisciplineFilter(allSubjects);

                // 3. Завантаження Лекцій
                const lRes = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "lesson"]')}`);
                const lData = await lRes.json();
                allLessons = lData.result || [];
                renderLessons(allLessons);

            } catch (err) {
                console.error("Помилка завантаження даних Sanity:", err);
            }
        }

        // РЕНДЕР ПОРТФОЛІО
        function renderPortfolio(p) {
            document.getElementById('p-avatar').innerText = p.avatar || '👨‍🏫';
            document.getElementById('p-name').innerText = p.name || 'Викладач';
            document.getElementById('p-role').innerText = p.role || 'Викладач спецдисциплін';
            
            if(p.education) document.getElementById('p-education').innerText = '🎓 ' + p.education;
            if(p.interests) document.getElementById('p-interests').innerText = '🔬 Інтереси: ' + p.interests;
            if(p.contacts) document.getElementById('p-contacts').innerText = '📬 Контакти: ' + p.contacts;

            if (p.disciplines && Array.isArray(p.disciplines)) {
                const tagsContainer = document.getElementById('p-disciplines-tags');
                tagsContainer.innerHTML = p.disciplines.map(d => `<span class="tag">${escapeHTML(d)}</span>`).join('');
            }
        }

        // РЕНДЕР ДИСЦИПЛІН (З КНОПКАМИ ДОКУМЕНТІВ)
        function renderSubjects(subjects) {
            const container = document.getElementById('subjects-container');
            if (!subjects || subjects.length === 0) {
                container.innerHTML = '<div class="empty-state">Дисципліни ще не додані.</div>';
                return;
            }

            container.innerHTML = subjects.map(s => {
                const hasDocs = s.syllabusUrl || s.workProgramUrl || s.studyProgramUrl;

                return `
                    <div class="subject-card">
                        <div>
                            <div class="subject-header">
                                <span class="subject-icon">${s.icon || '📚'}</span>
                                <h3 class="subject-title">${escapeHTML(s.title)}</h3>
                            </div>
                            <p class="subject-desc">${escapeHTML(s.desc || '')}</p>
                        </div>

                        ${hasDocs ? `
                            <div class="subject-docs">
                                ${s.syllabusUrl ? `<a href="${escapeAttr(s.syllabusUrl)}" target="_blank" rel="noopener" class="doc-link-btn">📄 Силабус</a>` : ''}
                                ${s.workProgramUrl ? `<a href="${escapeAttr(s.workProgramUrl)}" target="_blank" rel="noopener" class="doc-link-btn">📋 Робоча програма</a>` : ''}
                                ${s.studyProgramUrl ? `<a href="${escapeAttr(s.studyProgramUrl)}" target="_blank" rel="noopener" class="doc-link-btn">🎓 Навчальна програма</a>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // РЕНДЕР ЛЕКЦІЙ
        function renderLessons(lessons) {
            const container = document.getElementById('lessons-container');
            if (!lessons || lessons.length === 0) {
                container.innerHTML = '<div class="empty-state">Матеріалів за обраними критеріями не знайдено.</div>';
                return;
            }

            container.innerHTML = lessons.map(l => `
                <div class="lesson-card">
                    <div class="lesson-header">
                        <h3 class="lesson-title">${escapeHTML(l.title)}</h3>
                        <div class="badges">
                            ${l.discipline ? `<span class="badge badge-discipline">${escapeHTML(l.discipline)}</span>` : ''}
                            ${l.taskType ? `<span class="badge badge-type">${escapeHTML(l.taskType)}</span>` : ''}
                        </div>
                    </div>

                    ${l.content ? `<div class="lesson-body">${l.content}</div>` : ''}

                    ${l.fileUrl ? `
                        <a href="${escapeAttr(l.fileUrl)}" target="_blank" rel="noopener" class="lesson-file-link">
                            📎 Завантажити / Відкрити файл матеріалу
                        </a>
                    ` : ''}
                </div>
            `).join('');
        }

        // ФІЛЬТРАЦІЯ ТА ПОШУК ЛЕКЦІЙ
        function filterLessons() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedDiscipline = document.getElementById('filter-discipline').value;

            const filtered = allLessons.filter(l => {
                const matchesSearch = !query || (l.title && l.title.toLowerCase().includes(query)) || (l.content && l.content.toLowerCase().includes(query));
                const matchesDiscipline = !selectedDiscipline || l.discipline === selectedDiscipline;
                return matchesSearch && matchesDiscipline;
            });

            renderLessons(filtered);
        }

        function populateDisciplineFilter(subjects) {
            const select = document.getElementById('filter-discipline');
            select.innerHTML = '<option value="">Всі дисципліни</option>' + 
                subjects.map(s => `<option value="${escapeAttr(s.title)}">${escapeHTML(s.title)}</option>`).join('');
        }

        // Вспоміжні функції безпеки
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
