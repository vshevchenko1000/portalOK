<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навчальний портал</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #00a3ff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .breadcrumbs {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .breadcrumbs a {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }

        .breadcrumbs a:hover {
            text-decoration: underline;
        }

        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        /* Hero / Профіль */
        .hero-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hero-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hero-avatar {
            font-size: 2.5rem;
            background: #f1f5f9;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .portfolio-btn {
            padding: 10px 18px;
            border: 2px solid var(--accent);
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .portfolio-btn:hover {
            background: #f0f9ff;
        }

        /* Дисципліни */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .component-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .component-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .icon-box {
            font-size: 1.5rem;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .card-description {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .subject-docs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .doc-btn {
            display: inline-block;
            padding: 6px 12px;
            background: #f1f5f9;
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.8rem;
            text-decoration: none;
            transition: background 0.2s;
        }

        .doc-btn:hover {
            background: #e2e8f0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
        }

        /* Фільтри */
        .filters-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--text-main);
            color: #fff;
            border-color: var(--text-main);
        }

        .filter-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Список лекцій */
        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .lesson-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .lesson-item:hover {
            border-color: var(--accent);
        }

        .task-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Перегляд лекції */
        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .lesson-content {
            line-height: 1.6;
            font-size: 1rem;
            color: #334155;
            margin-bottom: 32px;
        }

        .attachment-block {
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Модальне вікно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            border: none;
            background: transparent;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Шапка та Хлібні крихти -->
    <header>
        <div id="breadcrumbs" class="breadcrumbs">
            <span>Головна</span>
        </div>
    </header>

    <!-- 1. ГОЛОВНА СТОРІНКА -->
    <div id="view-main" class="page-view active">
        <div class="hero-section">
            <div class="hero-info">
                <div id="hero-avatar" class="hero-avatar">👤</div>
                <div>
                    <h1 id="hero-name">Викладач</h1>
                    <p id="hero-role" style="color: var(--text-muted);">Дисципліни та лекції</p>
                </div>
            </div>
            <button id="hero-portfolio-btn" class="portfolio-btn" onclick="openPortfolioModal()">Портфоліо</button>
        </div>

        <h2 style="margin-bottom: 16px;">Дисципліни</h2>
        <div id="subjects-container" class="subjects-grid">
            <!-- Список дисциплін рендериться JS -->
        </div>
    </div>

    <!-- 2. СТОРІНКА ДИСЦИПЛІНИ -->
    <div id="view-subject" class="page-view">
        <div style="margin-bottom: 24px;">
            <h1 id="subject-title">Назва предмета</h1>
            <p id="subject-desc" style="color: var(--text-muted); margin-top: 8px;"></p>
            <div id="subject-header-docs" class="subject-docs-container" style="margin-top: 16px;"></div>
        </div>

        <div id="filters-bar" class="filters-bar">
            <!-- Фільтри типів завдань рендеряться JS -->
        </div>

        <div id="modules-container">
            <!-- Список матеріалів рендериться JS -->
        </div>
    </div>

    <!-- 3. СТОРІНКА МАТЕРІАЛУ (ЛЕКЦІЇ) -->
    <div id="view-lesson" class="page-view">
        <div class="lesson-card">
            <div class="lesson-header">
                <h1 id="lesson-title">Назва лекції</h1>
                <span id="lesson-badge" class="task-badge">Лекція</span>
            </div>

            <div id="lesson-body" class="lesson-content">
                <!-- Вміст матеріалу -->
            </div>

            <div id="attachment-block" class="attachment-block" style="display: none;">
                <span>📎 Прикріплений файл</span>
                <a id="download-btn" href="#" target="_blank" class="doc-btn">Завантажити</a>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО ПОРТФОЛІО -->
    <div id="portfolioModal" class="modal-overlay" onclick="closePortfolioOutside(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closePortfolioModal()">✕</button>
            <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
                <div id="modal-avatar" class="hero-avatar">👤</div>
                <div>
                    <h2 id="modal-name">Викладач</h2>
                    <p id="modal-role" style="font-weight: 600;">Посада</p>
                </div>
            </div>
            <div style="margin-bottom: 16px;">
                <h4 style="margin-bottom: 6px;">Про себе</h4>
                <p id="modal-bio" style="color: var(--text-muted); font-size: 0.95rem;">-</p>
            </div>
            <div>
                <h4 style="margin-bottom: 6px;">Контакти</h4>
                <p id="modal-contacts" style="color: var(--text-muted); font-size: 0.95rem;">-</p>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        const SANITY_PROJECT_ID = "uld9o5j2"; 
        const SANITY_DATASET = "production";

        let subjectsList = [];
        let lessonsList = [];
        let taskTypesList = [];
        let portfolioData = null;

        let currentSubject = null;
        let activeFilter = 'ALL';

        async function loadPortalData() {
            try {
                // 1. Портфоліо
                const pRes = await fetch(
                    `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "portfolio"][0]')}`,
                    { cache: 'no-store' }
                );
                const pData = await pRes.json();
                if(pData.result) {
                    portfolioData = pData.result;
                    applyPortfolioData(portfolioData);
                }

                // 2. Типи завдань
                const ttRes = await fetch(
                    `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "taskType"]')}`,
                    { cache: 'no-store' }
                );
                const ttData = await ttRes.json();
                taskTypesList = ttData.result || [];

                // 3. Дисципліни
                const subGROQ = `*[_type == "subject"]{
                    ...,
                    "syllabusUrl": coalesce(syllabusUrl, syllabus.asset->url),
                    "workProgramUrl": coalesce(workProgramUrl, workProgram.asset->url),
                    "studyProgramUrl": coalesce(studyProgramUrl, studyProgram.asset->url)
                }`;
                const subRes = await fetch(
                    `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent(subGROQ)}`,
                    { cache: 'no-store' }
                );
                const subData = await subRes.json();
                subjectsList = subData.result || [];

                // 4. Лекції
                const lesGROQ = `*[_type == "lesson"]{
                    ...,
                    "fileUrl": coalesce(fileUrl, file.asset->url)
                }`;
                const lesRes = await fetch(
                    `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent(lesGROQ)}`,
                    { cache: 'no-store' }
                );
                const lesData = await lesRes.json();
                lessonsList = lesData.result || [];

                renderSubjects();
            } catch (err) {
                console.error("Помилка завантаження Sanity:", err);
            }
        }

        function applyPortfolioData(p) {
            if(p.name) {
                document.getElementById('hero-name').innerText = p.name;
                document.getElementById('modal-name').innerText = p.name;
            }
            if(p.role) {
                document.getElementById('hero-role').innerText = p.role;
                document.getElementById('modal-role').innerText = p.role;
            }
            if(p.avatar) {
                document.getElementById('hero-avatar').innerText = p.avatar;
                document.getElementById('modal-avatar').innerText = p.avatar;
            }
            if(p.color) {
                document.getElementById('hero-portfolio-btn').style.borderColor = p.color;
                document.getElementById('modal-role').style.color = p.color;
            }
            if(p.bio) document.getElementById('modal-bio').innerText = p.bio;
            if(p.contacts) document.getElementById('modal-contacts').innerText = p.contacts;
        }

        function showView(viewId) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function navToMain() {
            showView('view-main');
            document.getElementById('breadcrumbs').innerHTML = '<span>Головна</span>';
        }

        function navToSubject(subjectId) {
            if (subjectId) {
                currentSubject = subjectsList.find(s => s._id === subjectId) || currentSubject;
            }

            if (!currentSubject) return;

            document.getElementById('subject-title').innerText = currentSubject.title || 'Предмет';
            document.getElementById('subject-desc').innerText = currentSubject.desc || '';

            const docsHeader = document.getElementById('subject-header-docs');
            const hasDocs = currentSubject.syllabusUrl || currentSubject.workProgramUrl || currentSubject.studyProgramUrl;
            
            if (hasDocs) {
                docsHeader.style.display = 'flex';
                docsHeader.innerHTML = `
                    ${currentSubject.syllabusUrl ? `<a href="${escapeAttr(currentSubject.syllabusUrl)}" target="_blank" class="doc-btn">📄 Силабус</a>` : ''}
                    ${currentSubject.workProgramUrl ? `<a href="${escapeAttr(currentSubject.workProgramUrl)}" target="_blank" class="doc-btn">📋 Робоча програма</a>` : ''}
                    ${currentSubject.studyProgramUrl ? `<a href="${escapeAttr(currentSubject.studyProgramUrl)}" target="_blank" class="doc-btn">🎓 Навчальна програма</a>` : ''}
                `;
            } else {
                docsHeader.style.display = 'none';
            }

            document.getElementById('breadcrumbs').innerHTML = `
                <a onclick="navToMain()">Головна</a> <span>/</span> <span>${currentSubject.title}</span>
            `;

            activeFilter = 'ALL';
            renderFilters();
            renderLessonsList();
            showView('view-subject');
        }

        function openLessonById(lessonId) {
            const lesson = lessonsList.find(l => l._id === lessonId);
            if (!lesson) return;

            document.getElementById('lesson-title').innerText = lesson.title || 'Без назви';
            document.getElementById('lesson-body').innerHTML = lesson.content || '<p style="color: #64748b;">Текст матеріалу відсутній.</p>';

            const badge = document.getElementById('lesson-badge');
            const ttObj = taskTypesList.find(t => t._id === lesson.typeId);
            badge.innerText = ttObj ? ttObj.title : 'Матеріал';
            badge.style.background = ttObj ? ttObj.color : '#e0f2fe';

            const attachBlock = document.getElementById('attachment-block');
            if (lesson.fileUrl && lesson.fileUrl.trim() !== '') {
                attachBlock.style.display = 'flex';
                document.getElementById('download-btn').href = lesson.fileUrl;
            } else {
                attachBlock.style.display = 'none';
            }

            document.getElementById('breadcrumbs').innerHTML = `
                <a onclick="navToMain()">Головна</a> <span>/</span>
                <a onclick="navToSubject('${currentSubject ? currentSubject._id : ''}')">${currentSubject ? currentSubject.title : 'Предмет'}</a> <span>/</span>
                <span>${lesson.title}</span>
            `;

            showView('view-lesson');
        }

        function renderSubjects() {
            const container = document.getElementById('subjects-container');
            if(subjectsList.length === 0) {
                container.innerHTML = '<p style="color: #64748b;">Дисциплін поки немає.</p>';
                return;
            }

            container.innerHTML = subjectsList.map(sub => {
                const hasDocs = sub.syllabusUrl || sub.workProgramUrl || sub.studyProgramUrl;

                return `
                    <div class="component-card" onclick="navToSubject('${sub._id}')">
                        <div>
                            <div class="card-header">
                                <div class="icon-box">${sub.icon || '📚'}</div>
                                <div class="card-title">${sub.title}</div>
                            </div>
                            <p class="card-description">${sub.desc || ''}</p>

                            ${hasDocs ? `
                                <div class="subject-docs-container" onclick="event.stopPropagation()">
                                    ${sub.syllabusUrl ? `<a href="${escapeAttr(sub.syllabusUrl)}" target="_blank" class="doc-btn">📄 Силабус</a>` : ''}
                                    ${sub.workProgramUrl ? `<a href="${escapeAttr(sub.workProgramUrl)}" target="_blank" class="doc-btn">📋 Робоча програма</a>` : ''}
                                    ${sub.studyProgramUrl ? `<a href="${escapeAttr(sub.studyProgramUrl)}" target="_blank" class="doc-btn">🎓 Навчальна програма</a>` : ''}
                                </div>
                            ` : ''}
                        </div>
                        <div class="card-footer">
                            <span>Перейти до матеріалів</span>
                            <span>→</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderFilters() {
            const bar = document.getElementById('filters-bar');
            
            let html = `
                <button class="filter-btn ${activeFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">
                    ✨ Усі матеріали
                </button>
            `;

            html += taskTypesList.map(tt => `
                <button class="filter-btn ${activeFilter === tt._id ? 'active' : ''}" onclick="setFilter('${tt._id}')">
                    <span class="filter-dot" style="background: ${tt.color || '#00a3ff'};"></span>
                    ${tt.title}
                </button>
            `).join('');

            bar.innerHTML = html;
        }

        function setFilter(typeId) {
            activeFilter = typeId;
            renderFilters();
            renderLessonsList();
        }

        function renderLessonsList() {
            const container = document.getElementById('modules-container');
            if (!currentSubject) return;

            let filtered = lessonsList.filter(l => l.subjectId === currentSubject._id);

            if (activeFilter !== 'ALL') {
                filtered = filtered.filter(l => l.typeId === activeFilter);
            }

            if (filtered.length > 0) {
                container.innerHTML = `
                    <div class="module-block">
                        <div class="lessons-list">
                            ${filtered.map(item => {
                                const ttObj = taskTypesList.find(t => t._id === item.typeId);
                                const badgeTitle = ttObj ? ttObj.title : 'Матеріал';
                                const badgeColor = ttObj ? ttObj.color : '#e0f2fe';

                                return `
                                    <div class="lesson-item" onclick="openLessonById('${item._id}')">
                                        <span style="font-weight: 600; font-size: 0.95rem;">${item.title}</span>
                                        <span class="task-badge" style="background: ${badgeColor};">${badgeTitle}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = '<p style="color: #64748b; margin-top: 10px;">Матеріалів за обраним фільтром не знайдено.</p>';
            }
        }

        function escapeAttr(text) {
            if (!text) return '';
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function openPortfolioModal() { document.getElementById('portfolioModal').style.display = 'flex'; }
        function closePortfolioModal() { document.getElementById('portfolioModal').style.display = 'none'; }
        function closePortfolioOutside(e) { if (e.target.classList.contains('modal-overlay')) closePortfolioModal(); }

        document.addEventListener('DOMContentLoaded', loadPortalData);
    </script>
</body>
</html>
