<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навчальні Матеріали — ДФКР</title>
    <style>
        :root {
            --deep-blue: #001b4c;
            --bright-blue: #00a3ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Хедер */
        header {
            background: var(--deep-blue);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0,27,76,0.15);
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area h1 { font-size: 1.5rem; font-weight: 700; }
        .logo-area p { font-size: 0.85rem; color: #94a3b8; }

        .btn-portfolio {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-portfolio:hover {
            background: var(--bright-blue);
            border-color: var(--bright-blue);
        }

        /* Контейнер сайту */
        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Блок Дисциплін */
        .section-title {
            font-size: 1.3rem;
            color: var(--deep-blue);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 35px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .subject-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border-color: var(--bright-blue);
        }

        .subject-card .icon { font-size: 2rem; margin-bottom: 8px; }
        .subject-card h3 { font-size: 1.1rem; color: var(--deep-blue); margin-bottom: 4px; }
        .subject-card p { font-size: 0.85rem; color: var(--text-muted); }

        /* Панель фільтрації матеріалів */
        .filter-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }

        select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background: white;
        }

        /* Список Матеріалів */
        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .lesson-title { font-size: 1.15rem; color: var(--deep-blue); font-weight: 700; }

        .badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .badge-discipline { background: #e0e7ff; color: #3730a3; }
        .badge-type { background: #e0f2fe; color: #0369a1; }

        .lesson-content {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .btn-file {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bright-blue);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-file:hover { background: #008be6; }

        /* Модальне вікно портфоліо */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: #f1f5f9;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
        }

        .profile-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .profile-avatar { font-size: 4rem; line-height: 1; margin-bottom: 10px; }
        .profile-name { font-size: 1.4rem; color: var(--deep-blue); font-weight: 700; }
        .profile-role { color: var(--bright-blue); font-weight: 600; font-size: 0.95rem; }

        .info-block { margin-bottom: 18px; }
        .info-block h4 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
        .info-block p { font-size: 0.95rem; color: var(--text-main); }

        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .tag-item { background: #f1f5f9; color: var(--deep-blue); font-weight: 600; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header>
        <div class="header-container">
            <div class="logo-area">
                <h1>🎓 Дніпровський фаховий коледж радіоелектроніки</h1>
                <p>База навчальних матеріалів та лекцій</p>
            </div>
            <button class="btn-portfolio" onclick="openPortfolioModal()">
                <span>👨‍🏫</span> Портфоліо викладача
            </button>
        </div>
    </header>

    <!-- ОСНОВНИЙ КОНТЕНТ -->
    <div class="main-container">
        
        <!-- СЕКЦІЯ ДИСЦИПЛІН -->
        <h2 class="section-title">📚 Дисципліни</h2>
        <div class="subjects-grid" id="subjects-container">
            <p style="color: var(--text-muted);">Завантаження дисциплін...</p>
        </div>

        <!-- СЕКЦІЯ МАТЕРІАЛІВ -->
        <h2 class="section-title">📝 Навчальні матеріали та Лекції</h2>
        
        <!-- Фільтри -->
        <div class="filter-bar">
            <div class="filter-group">
                <label for="filter-discipline">Дисципліна:</label>
                <select id="filter-discipline" onchange="applyFilters()">
                    <option value="ALL">Всі дисципліни</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-type">Тип завдань:</label>
                <select id="filter-type" onchange="applyFilters()">
                    <option value="ALL">Всі типи</option>
                </select>
            </div>
        </div>

        <!-- Список матеріалів -->
        <div class="lessons-list" id="lessons-container">
            <p style="color: var(--text-muted);">Завантаження матеріалів...</p>
        </div>

    </div>

    <!-- МОДАЛЬНЕ ВІКНО ПОРТФОЛІО -->
    <div class="modal-overlay" id="portfolio-modal" onclick="closeModalOnOverlay(event)">
        <div class="modal-card">
            <button class="close-btn" onclick="closePortfolioModal()">✕</button>
            
            <div class="profile-header">
                <div class="profile-avatar" id="m-avatar">👨‍🏫</div>
                <h3 class="profile-name" id="m-name">Завантаження...</h3>
                <p class="profile-role" id="m-role"></p>
            </div>

            <div class="info-block">
                <h4>📬 Контакти</h4>
                <p id="m-contacts">—</p>
            </div>

            <div class="info-block">
                <h4>🎓 Освіта</h4>
                <p id="m-education">—</p>
            </div>

            <div class="info-block">
                <h4>🔬 Наукові інтереси</h4>
                <p id="m-interests">—</p>
            </div>

            <div class="info-block">
                <h4>📚 Ключові дисципліни</h4>
                <div class="tags-container" id="m-tags">—</div>
            </div>
        </div>
    </div>

    <script>
        const SANITY_PROJECT_ID = "uld9o5j2";
        const SANITY_DATASET = "production";

        let allLessons = [];
        let allSubjects = [];
        let allTaskTypes = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchSiteData();
        });

        async function fetchSiteData() {
            try {
                // 1. Отримання Портфоліо
                const pUrl = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "portfolio"][0]')}`;
                const pRes = await fetch(pUrl);
                const pData = await pRes.json();
                if (pData.result) renderPortfolioModal(pData.result);

                // 2. Отримання Дисциплін
                const sUrl = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "subject"]')}`;
                const sRes = await fetch(sUrl);
                const sData = await sRes.json();
                allSubjects = sData.result || [];
                renderSubjects(allSubjects);
                populateSubjectFilter(allSubjects);

                // 3. Отримання Типів матеріалів
                const tUrl = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "taskType"]')}`;
                const tRes = await fetch(tUrl);
                const tData = await tRes.json();
                allTaskTypes = tData.result || [];
                populateTypeFilter(allTaskTypes);

                // 4. Отримання Лекцій/Завдань
                const lUrl = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "lesson"]')}`;
                const lRes = await fetch(lUrl);
                const lData = await lRes.json();
                allLessons = lData.result || [];
                renderLessons(allLessons);

            } catch (err) {
                console.error("Помилка при завантаженні даних:", err);
            }
        }

        /* --- ВІДОБРАЖЕННЯ ПОРТФОЛІО --- */
        function renderPortfolioModal(p) {
            document.getElementById('m-name').innerText = p.name || "Ім'я не вказано";
            document.getElementById('m-role').innerText = p.role || "";
            document.getElementById('m-avatar').innerText = p.avatar || "👨‍🏫";
            document.getElementById('m-contacts').innerText = p.contacts || "—";
            document.getElementById('m-education').innerText = p.education || "—";
            document.getElementById('m-interests').innerText = p.interests || "—";

            const tagsContainer = document.getElementById('m-tags');
            if (p.disciplines && Array.isArray(p.disciplines) && p.disciplines.length > 0) {
                tagsContainer.innerHTML = p.disciplines
                    .map(item => `<span class="tag-item">${item}</span>`)
                    .join('');
            } else {
                tagsContainer.innerHTML = '<span>—</span>';
            }
        }

        function openPortfolioModal() {
            document.getElementById('portfolio-modal').classList.add('active');
        }

        function closePortfolioModal() {
            document.getElementById('portfolio-modal').classList.remove('active');
        }

        function closeModalOnOverlay(e) {
            if (e.target.id === 'portfolio-modal') closePortfolioModal();
        }

        /* --- ВІДОБРАЖЕННЯ ДИСЦИПЛІН --- */
        function renderSubjects(subjects) {
            const container = document.getElementById('subjects-container');
            if (subjects.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted)">Дисциплін поки немає.</p>';
                return;
            }
            container.innerHTML = subjects.map(s => `
                <div class="subject-card" onclick="filterBySubject('${s.title}')">
                    <div class="icon">${s.icon || '📚'}</div>
                    <h3>${s.title}</h3>
                    <p>${s.desc || 'Опис відсутній'}</p>
                </div>
            `).join('');
        }

        /* --- ФІЛЬТРИ ТА ВІДОБРАЖЕННЯ МАТЕРІАЛІВ --- */
        function populateSubjectFilter(subjects) {
            const select = document.getElementById('filter-discipline');
            subjects.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.title;
                opt.innerText = s.title;
                select.appendChild(opt);
            });
        }

        function populateTypeFilter(types) {
            const select = document.getElementById('filter-type');
            types.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.title;
                opt.innerText = t.title;
                select.appendChild(opt);
            });
        }

        function filterBySubject(title) {
            document.getElementById('filter-discipline').value = title;
            applyFilters();
        }

        function applyFilters() {
            const selectedDiscipline = document.getElementById('filter-discipline').value;
            const selectedType = document.getElementById('filter-type').value;

            const filtered = allLessons.filter(l => {
                const matchDiscipline = (selectedDiscipline === 'ALL') || (l.discipline === selectedDiscipline);
                const matchType = (selectedType === 'ALL') || (l.taskType === selectedType);
                return matchDiscipline && matchType;
            });

            renderLessons(filtered);
        }

        function renderLessons(lessons) {
            const container = document.getElementById('lessons-container');
            if (lessons.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 30px 0;">За вашим запитом матеріалів не знайдено.</p>';
                return;
            }

            container.innerHTML = lessons.map(l => `
                <div class="lesson-card">
                    <div class="lesson-header">
                        <div class="lesson-title">${l.title}</div>
                        <div class="badges">
                            ${l.discipline ? `<span class="badge badge-discipline">${l.discipline}</span>` : ''}
                            ${l.taskType ? `<span class="badge badge-type">${l.taskType}</span>` : ''}
                        </div>
                    </div>
                    ${l.content ? `<div class="lesson-content">${l.content}</div>` : ''}
                    ${l.fileUrl ? `<a href="${l.fileUrl}" target="_blank" class="btn-file">📎 Відкрити / Завантажити файл</a>` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
