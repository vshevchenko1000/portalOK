<script>
    const MAIN_SANITY_PROJECT_ID = "uld9o5j2";
    const MAIN_SANITY_DATASET = "production";

    async function loadFrontendPortfolio() {
        try {
            // Отримуємо портфоліо, де заповнене ім'я
            const query = encodeURIComponent('*[_type == "portfolio" && defined(name)][0]');
            const url = `https://${MAIN_SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${MAIN_SANITY_DATASET}?query=${query}`;
            
            const res = await fetch(url);
            const data = await res.json();
            const p = data.result;

            if (!p) return;

            // 1. Оновлюємо базові текстові поля (якщо вони є на сторінці)
            const nameEl = document.getElementById('modal-p-name') || document.querySelector('.teacher-name');
            const roleEl = document.getElementById('modal-p-role') || document.querySelector('.teacher-role');
            const contactEl = document.getElementById('modal-p-contacts') || document.querySelector('.teacher-contacts');
            
            if (nameEl) nameEl.textContent = p.name || 'Викладач';
            if (roleEl) roleEl.textContent = p.role || '';
            if (contactEl) contactEl.textContent = p.contacts || '';

            // 2. Формуємо блок для заміни "Завантаження інформації..."
            let contentHtml = '';

            if (p.education) {
                const edFormatted = p.education.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                contentHtml += `<div style="margin-bottom: 12px;"><strong>🎓 Освіта:</strong><br>${edFormatted}</div>`;
            }

            if (p.interests) {
                const intFormatted = p.interests.replace(/\n/g, '<br>');
                contentHtml += `<div style="margin-bottom: 12px;"><strong>🔬 Наукові інтереси:</strong><br>${intFormatted}</div>`;
            }

            if (p.disciplines) {
                const discList = Array.isArray(p.disciplines) 
                    ? p.disciplines 
                    : String(p.disciplines).split(',').map(d => d.trim());

                if (discList.length > 0 && discList[0] !== '') {
                    const tags = discList.map(d => `<span style="display:inline-block; background:#e0f2fe; color:#0369a1; padding:2px 8px; border-radius:4px; margin:2px; font-size:0.85em;">${d}</span>`).join(' ');
                    contentHtml += `<div style="margin-bottom: 12px;"><strong>📚 Ключові дисципліни:</strong><br>${tags}</div>`;
                }
            }

            // 3. Знаходимо контейнер із текстом "Завантаження інформації..." і замінюємо його
            const infoContainers = document.querySelectorAll('*');
            infoContainers.forEach(el => {
                if (el.children.length === 0 && el.textContent.includes('Завантаження інформації...')) {
                    el.innerHTML = contentHtml || 'Інформація відсутня.';
                }
            });

        } catch (err) {
            console.error("Помилка завантаження даних на фронтенді:", err);
        }
    }

    // Автоматичний запуск при завантаженні сторінки
    document.addEventListener('DOMContentLoaded', loadFrontendPortfolio);
</script>
