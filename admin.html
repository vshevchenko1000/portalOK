<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель ДФКР</title>
    <style>
        :root {
            --deep-blue: #001b4c;
            --bright-blue: #00a3ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-color); color: #0f172a; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header {
            background: var(--deep-blue); color: white; padding: 20px; border-radius: 12px;
            margin-bottom: 24px; border-bottom: 4px solid var(--bright-blue);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .card { background: white; padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card h2 { color: var(--deep-blue); font-size: 1.2rem; margin-bottom: 16px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input, select, textarea {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 0.95rem; font-family: inherit;
        }
        textarea { height: 100px; resize: vertical; }

        .btn {
            background: var(--bright-blue); color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); padding: 6px 12px; font-size: 0.8rem; }

        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: #f8fafc; border: 1px solid var(--border-color);
            border-radius: 8px; margin-bottom: 8px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>⚙️ Панель керування контентом</h1>
            <p style="font-size: 0.85rem; color: #94a3b8;">Портал ДФКР (Sanity CMS)</p>
        </div>
        <a href="index.html" target="_blank" style="color: var(--bright-blue); text-decoration: none; font-weight: 600; background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 8px;">Перейти на сайт ↗</a>
    </header>

    <!-- Токен авторизації -->
    <div class="card" style="background: #eff6ff; border-color: #bfdbfe;">
        <div class="form-group" style="margin: 0;">
            <label for="token">🔑 Sanity API Write Token (необхідний для збереження змін):</label>
            <input type="password" id="token" placeholder="Введіть ваш sk... токен із Sanity Dashboard" onchange="localStorage.setItem('sanity_token', this.value)">
        </div>
    </div>

    <!-- 1. СТВОРЕННЯ ДИСЦИПЛІНИ -->
    <div class="card">
        <h2>📚 1. Додати нову дисципліну (Предмет)</h2>
        <form id="discipline-form">
            <div class="grid-2">
                <div class="form-group">
                    <label>Назва дисципліни:</label>
                    <input type="text" id="disc-title" placeholder="напр. Інформатика" required>
                </div>
                <div class="form-group">
                    <label>Іконка (Емодзі):</label>
                    <input type="text" id="disc-icon" placeholder="💻 або ⚡ або ⚙️" required>
                </div>
            </div>
            <div class="form-group">
                <label>Короткий опис дисципліни:</label>
                <input type="text" id="disc-desc" placeholder="Основи інформаційних технологій..." required>
            </div>
            <button type="submit" class="btn">➕ Додати дисципліну</button>
        </form>

        <h3 style="margin-top: 20px; font-size: 1rem; color: var(--deep-blue);">Наявні дисципліни:</h3>
        <div id="disciplines-list" style="margin-top: 10px;">Завантаження...</div>
    </div>

    <!-- 2. СТВОРЕННЯ ЛЕКЦІЇ -->
    <div class="card">
        <h2>📝 2. Додати лекцію або лабораторну</h2>
        <form id="lesson-form">
            <div class="form-group">
                <label>Оберіть дисципліну:</label>
                <select id="lesson-discipline" required>
                    <option value="">-- Спочатку завантажте дисципліни --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Тема / Назва матеріалу:</label>
                <input type="text" id="lesson-title" placeholder="Лекція 1. Вступ до спецдисципліни" required>
            </div>
            <div class="form-group">
                <label>Текст / Зміст лекції:</label>
                <textarea id="lesson-content" placeholder="Введіть навчальний матеріал..."></textarea>
            </div>
            <div class="form-group">
                <label>Посилання на матеріали (Google Drive / PDF / ZIP):</label>
                <input type="url" id="lesson-url" placeholder="https://drive.google.com/...">
            </div>
            <button type="submit" class="btn">🚀 Опублікувати лекцію</button>
        </form>

        <h3 style="margin-top: 20px; font-size: 1rem; color: var(--deep-blue);">Опубліковані лекції:</h3>
        <div id="lessons-list" style="margin-top: 10px;">Завантаження...</div>
    </div>
</div>

<script>
    const PROJECT_ID = "uld9o5j2";
    const DATASET = "production";

    // Відновлення токена з localStorage
    document.getElementById('token').value = localStorage.getItem('sanity_token') || '';

    function getToken() {
        const t = document.getElementById('token').value.trim();
        if(!t) alert("Будь ласка, вкажіть Sanity Write Token у верхньому полі!");
        return t;
    }

    // --- 1. ЗАВАНТАЖЕННЯ ДИСЦИПЛІН ТА ЛЕКЦІЙ ---
    async function loadData() {
        // Дисципліни
        const discQuery = encodeURIComponent('*[_type == "subject"]');
        const discRes = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${DATASET}?query=${discQuery}`);
        const discData = await discRes.json();
        
        renderDisciplines(discData.result || []);

        // Лекції
        const lessonQuery = encodeURIComponent('*[_type == "lesson"]');
        const lessonRes = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${DATASET}?query=${lessonQuery}`);
        const lessonData = await lessonRes.json();
        
        renderLessons(lessonData.result || []);
    }

    function renderDisciplines(items) {
        const select = document.getElementById('lesson-discipline');
        const list = document.getElementById('disciplines-list');

        if(items.length === 0) {
            select.innerHTML = '<option value="">Немає дисциплін. Створіть першу вище!</option>';
            list.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">Дисциплін поки немає в базі.</p>';
            return;
        }

        select.innerHTML = items.map(d => `<option value="${d.title}">${d.icon || '📚'} ${d.title}</option>`).join('');
        list.innerHTML = items.map(d => `
            <div class="list-item">
                <div><strong>${d.icon || '📚'} ${d.title}</strong> — <span style="color:#64748b;">${d.desc || ''}</span></div>
                <button class="btn btn-danger" onclick="deleteDoc('${d._id}')">Видалити</button>
            </div>
        `).join('');
    }

    function renderLessons(items) {
        const list = document.getElementById('lessons-list');
        if(items.length === 0) {
            list.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">Лекцій поки немає в базі.</p>';
            return;
        }

        list.innerHTML = items.map(l => `
            <div class="list-item">
                <div>
                    <strong>[${l.discipline || 'Загальне'}]</strong> ${l.title}
                </div>
                <button class="btn btn-danger" onclick="deleteDoc('${l._id}')">Видалити</button>
            </div>
        `).join('');
    }

    // --- 2. ДОДАВАННЯ ДИСЦИПЛІНИ ---
    document.getElementById('discipline-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = getToken();
        if(!token) return;

        const doc = {
            mutations: [{
                create: {
                    _type: 'subject',
                    title: document.getElementById('disc-title').value,
                    icon: document.getElementById('disc-icon').value,
                    desc: document.getElementById('disc-desc').value
                }
            }]
        };

        const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${DATASET}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(doc)
        });

        if(res.ok) {
            alert('🎉 Дисципліну успішно додано!');
            document.getElementById('discipline-form').reset();
            loadData();
        } else {
            alert('Помилка збереження. Перевірте правильності API-токена!');
        }
    });

    // --- 3. ДОДАВАННЯ ЛЕКЦІЇ ---
    document.getElementById('lesson-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = getToken();
        if(!token) return;

        const doc = {
            mutations: [{
                create: {
                    _type: 'lesson',
                    discipline: document.getElementById('lesson-discipline').value,
                    title: document.getElementById('lesson-title').value,
                    content: document.getElementById('lesson-content').value,
                    fileUrl: document.getElementById('lesson-url').value,
                    createdAt: new Date().toISOString()
                }
            }]
        };

        const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${DATASET}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(doc)
        });

        if(res.ok) {
            alert('🎉 Лекцію успішно опубліковано!');
            document.getElementById('lesson-form').reset();
            loadData();
        } else {
            alert('Помилка збереження. Перевірте API-токен!');
        }
    });

    // --- 4. ВИДАЛЕННЯ ---
    async function deleteDoc(id) {
        const token = getToken();
        if(!token || !confirm('Дійсно видалити цей елемент?')) return;

        const doc = { mutations: [{ delete: { id: id } }] };
        const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${DATASET}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(doc)
        });

        if(res.ok) {
            loadData();
        }
    }

    loadData();
</script>
</body>
</html>
