<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель ДФКР</title>
    <style>
        :root {
            --deep-blue: #001b4c;
            --bright-blue: #00a3ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-color); color: #0f172a; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header {
            background: var(--deep-blue); color: white; padding: 20px 28px; border-radius: 14px;
            margin-bottom: 24px; border-bottom: 4px solid var(--bright-blue);
            display: flex; justify-content: space-between; align-items: center; shadow: var(--shadow);
        }
        
        .card { background: white; padding: 28px; border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 24px; box-shadow: var(--shadow); }
        .card h2 { color: var(--deep-blue); font-size: 1.25rem; margin-bottom: 18px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #334155; }
        input, select, textarea {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color);
            border-radius: 10px; font-size: 0.95rem; font-family: inherit; transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--bright-blue); box-shadow: 0 0 0 3px rgba(0, 163, 255, 0.15); }
        textarea { height: 110px; resize: vertical; }

        /* Кнопкова палітра вибору іконок */
        .icon-picker { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
        .icon-opt {
            width: 48px; height: 48px; font-size: 1.4rem; border: 2px solid var(--border-color);
            background: #f8fafc; border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-opt:hover { border-color: var(--bright-blue); background: #f0f9ff; transform: translateY(-2px); }
        .icon-opt.active { border-color: var(--bright-blue); background: #e0f2fe; box-shadow: 0 0 0 3px rgba(0,163,255,0.25); transform: scale(1.05); }

        .btn {
            background: var(--bright-blue); color: white; border: none; padding: 12px 24px;
            border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; font-size: 0.95rem;
        }
        .btn:hover { background: #008cdb; transform: translateY(-1px); }
        .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; padding: 6px 14px; font-size: 0.85rem; border-radius: 8px; }
        .btn-danger:hover { background: var(--danger); color: white; }

        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; background: #f8fafc; border: 1px solid var(--border-color);
            border-radius: 10px; margin-bottom: 10px; transition: all 0.2s;
        }
        .list-item:hover { background: white; border-color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>⚙️ Панель керування порталом</h1>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">Дніпровський фаховий коледж радіоелектроніки</p>
        </div>
        <a href="index.html" target="_blank" style="color: var(--bright-blue); text-decoration: none; font-weight: 600; background: rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);">Перейти на сайт ↗</a>
    </header>

    <!-- Токен авторизації -->
    <div class="card" style="background: #eff6ff; border-color: #bfdbfe;">
        <div class="form-group" style="margin: 0;">
            <label for="token">🔑 Sanity API Write Token (необхідний для збереження змін):</label>
            <input type="password" id="token" placeholder="Введіть ваш sk... токен із Sanity Dashboard" onchange="localStorage.setItem('sanity_token', this.value)">
        </div>
    </div>

    <!-- 1. СТВОРЕННЯ ДИСЦИПЛІНИ -->
    <div class="card">
        <h2>📚 1. Додати нову дисципліну</h2>
        <form id="discipline-form">
            <div class="form-group">
                <label>Назва дисципліни:</label>
                <input type="text" id="disc-title" placeholder="напр. Інформатика & Інтернет-технології" required>
            </div>

            <div class="form-group">
                <label>Оберіть іконку кнопкою:</label>
                <div class="icon-picker" id="icon-picker">
                    <button type="button" class="icon-opt active" data-icon="💻">💻</button>
                    <button type="button" class="icon-opt" data-icon="⚡">⚡</button>
                    <button type="button" class="icon-opt" data-icon="⚙️">⚙️</button>
                    <button type="button" class="icon-opt" data-icon="🌐">🌐</button>
                    <button type="button" class="icon-opt" data-icon="🤖">🤖</button>
                    <button type="button" class="icon-opt" data-icon="🛠️">🛠️</button>
                    <button type="button" class="icon-opt" data-icon="📐">📐</button>
                    <button type="button" class="icon-opt" data-icon="📡">📡</button>
                    <button type="button" class="icon-opt" data-icon="📱">📱</button>
                    <button type="button" class="icon-opt" data-icon="🔬">🔬</button>
                    <button type="button" class="icon-opt" data-icon="📊">📊</button>
                    <button type="button" class="icon-opt" data-icon="🎓">🎓</button>
                    <button type="button" class="icon-opt" data-icon="📖">📖</button>
                </div>
                <input type="hidden" id="disc-icon" value="💻">
            </div>

            <div class="form-group">
                <label>Короткий опис дисципліни:</label>
                <input type="text" id="disc-desc" placeholder="Опишіть стисло, про що цей предмет..." required>
            </div>
            <button type="submit" class="btn">➕ Створити дисципліну</button>
        </form>

        <h3 style="margin-top: 24px; font-size: 1rem; color: var(--deep-blue);">Наявні дисципліни:</h3>
        <div id="disciplines-list" style="margin-top: 12px;">Завантаження...</div>
    </div>

    <!-- 2. СТВОРЕННЯ ЛЕКЦІЇ -->
    <div class="card">
        <h2>📝 2. Опублікувати навчальний матеріал</h2>
        <form id="lesson-form">
            <div class="form-group">
                <label>Дисципліна:</label>
                <select id="lesson-discipline" required>
                    <option value="">-- Оберіть предмет із базі --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Тема / Назва матеріалу:</label>
                <input type="text" id="lesson-title" placeholder="Тема 1. Вступний огляд" required>
            </div>
            <div class="form-group">
                <label>Текст / Зміст лекції:</label>
                <textarea id="lesson-content" placeholder="Введіть навчальний матеріал або інструкцію..."></textarea>
            </div>
            <div class="form-group">
                <label>Посилання на файл (Google Drive / PDF / ZIP):</label>
                <input type="url" id="lesson-url" placeholder="https://drive.google.com/...">
            </div>
            <button type="submit" class="btn">🚀 Опублікувати матеріал</button>
        </form>

        <h3 style="margin-top: 24px; font-size: 1rem; color: var(--deep-blue);">Опубліковані матеріали:</h3>
        <div id="lessons-list" style="margin-top: 12px;">Завантаження...</div>
    </div>
</div>

<script>
    const PROJECT_ID = "uld9o5j2";
    const DATASET = "production";

    document.getElementById('token').value = localStorage.getItem('sanity_token') || '';

    // Логіка вибору іконки кнопками
    document.querySelectorAll('.icon-opt').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.icon-opt').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('disc-icon').value = this.dataset.icon;
        });
    });

    function getToken() {
        const t = document.getElementById('token').value.trim();
        if(!t) alert("Вкажіть ваш Sanity Write Token у верхньому синьому блоці!");
        return t;
    }

    async function loadData() {
        // Дисципліни
        const discQuery = encodeURIComponent('*[_type == "subject"]');
        const discRes = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${DATASET}?query=${discQuery}`);
        const discData = await discRes.json();
        renderDisciplines(discData.result || []);

        // Лекції
        const lessonQuery = encodeURIComponent('*[_type == "lesson"]');
        const lessonRes = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${DATASET}?query=${lessonQuery}`);
        const lessonData = await lessonRes.json();
        renderLessons(lessonData.result || []);
    }

    function renderDisciplines(items) {
        const select = document.getElementById('lesson-discipline');
        const list = document.getElementById('disciplines-list');

        if(items.length === 0) {
            select.innerHTML = '<option value="">Дисциплін ще немає. Створіть першу вище!</option>';
            list.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">Дисциплін поки немає в базі.</p>';
            return;
        }

        select.innerHTML = items.map(d => `<option value="${d.title}">${d.icon || '📚'} ${d.title}</option>`).join('');
        list.innerHTML = items.map(d => `
            <div class="list-item">
                <div><strong>${d.icon || '📚'} ${d.title}</strong> <span style="color:#64748b; font-size:0.85rem;">— ${d.desc || ''}</span></div>
                <button class="btn btn-danger" onclick="deleteDoc('${d._id}')">Видалити</button>
            </div>
        `).join('');
    }

    function renderLessons(items) {
        const list = document.getElementById('lessons-list');
        if(items.length === 0) {
            list.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">Матеріалів поки немає в базі.</p>';
            return;
        }

        list.innerHTML = items.map(l => `
            <div class="list-item">
                <div>
                    <strong style="color: var(--bright-blue);">[${l.discipline || 'Загальне'}]</strong> ${l.title}
                </div>
                <button class="btn btn-danger" onclick="deleteDoc('${l._id}')">Видалити</button>
            </div>
        `).join('');
    }

    // Створення дисципліни
    document.getElementById('discipline-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = getToken();
        if(!token) return;

        const doc = {
            mutations: [{
                create: {
                    _type: 'subject',
                    title: document.getElementById('disc-title').value,
                    icon: document.getElementById('disc-icon').value,
                    desc: document.getElementById('disc-desc').value
                }
            }]
        };

        const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${DATASET}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(doc)
        });

        if(res.ok) {
            alert('🎉 Дисципліну успішно додано!');
            document.getElementById('disc-title').value = '';
            document.getElementById('disc-desc').value = '';
            loadData();
        } else { alert('Помилка! Перевірте правильність токена!'); }
    });

    // Створення лекції
    document.getElementById('lesson-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = getToken();
        if(!token) return;

        const doc = {
            mutations: [{
                create: {
                    _type: 'lesson',
                    discipline: document.getElementById('lesson-discipline').value,
                    title: document.getElementById('lesson-title').value,
                    content: document.getElementById('lesson-content').value,
                    fileUrl: document.getElementById('lesson-url').value,
                    createdAt: new Date().toISOString()
                }
            }]
        };

        const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${DATASET}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(doc)
        });

        if(res.ok) {
            alert('🎉 Матеріал опубліковано!');
            document.getElementById('lesson-title').value = '';
            document.getElementById('lesson-content').value = '';
            document.getElementById('lesson-url').value = '';
            loadData();
        } else { alert('Помилка збереження! Перевірте токен!'); }
    });

    async function deleteDoc(id) {
        const token = getToken();
        if(!token || !confirm('Дійсно видалити цей елемент?')) return;

        const doc = { mutations: [{ delete: { id: id } }] };
        const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${DATASET}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(doc)
        });

        if(res.ok) loadData();
    }

    loadData();
</script>
</body>
</html>
