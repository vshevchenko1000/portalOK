<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управління — Адмінка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- СТИЛІ НЕ ЗМІНЮВАЛИСЯ -->
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.5; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 1.5rem 2rem; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        h1, h2, h3 { color: #0f172a; margin-bottom: 1rem; font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
        @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem; }
        input, textarea, select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background-color: #fff; }
        textarea { resize: vertical; min-height: 90px; }
        .btn { background-color: var(--primary); color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #dc2626; }
        .status-toast { position: fixed; bottom: 20px; right: 20px; padding: 1rem 1.5rem; border-radius: 8px; color: white; font-weight: 600; display: none; z-index: 1000; }
        .item-list { margin-top: 1rem; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">

    <!-- API Токен -->
    <div class="card" style="background: #f0f9ff; border-color: #bae6fd;">
        <h3>🔑 Sanity API Token</h3>
        <input type="password" id="sanity-token" placeholder="sk..." onchange="saveTokenLocally()">
    </div>

    <!-- Редагування Портфоліо -->
    <div class="card">
        <h2>Редагування Портфоліо Викладача</h2>
        <div class="grid-2">
            <div class="form-group">
                <label for="p-name">ПІБ Викладача:</label>
                <input type="text" id="p-name">
            </div>
            <div class="form-group">
                <label for="p-role">Посада / Статус:</label>
                <input type="text" id="p-role">
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label for="p-avatar">Аватар (Emoji або URL):</label>
                <input type="text" id="p-avatar">
            </div>
            <div class="form-group">
                <label for="p-contacts">📬 Контакти:</label>
                <input type="text" id="p-contacts">
            </div>
        </div>
        <div class="form-group">
            <label for="p-education">🎓 Освіта:</label>
            <textarea id="p-education"></textarea>
        </div>
        <div class="form-group">
            <label for="p-interests">🔬 Наукові інтереси:</label>
            <textarea id="p-interests"></textarea>
        </div>
        <div class="form-group">
            <label for="p-disciplines">📚 Ключові дисципліни (через кому):</label>
            <input type="text" id="p-disciplines">
        </div>
        <button class="btn" onclick="savePortfolio()">💾 Зберегти портфоліо</button>
    </div>

    <!-- Дисципліни -->
    <div class="card">
        <h2>📚 Дисципліни</h2>
        <div class="grid-2" style="margin-bottom: 1rem;">
            <input type="text" id="new-subject-title" placeholder="Назва дисципліни">
            <button class="btn" onclick="addSubject()">+ Додати дисципліну</button>
        </div>
        <div id="subjects-list" class="item-list"></div>
    </div>

    <!-- Типи завдань -->
    <div class="card">
        <h2>🏷️ Типи завдань</h2>
        <div class="grid-2" style="margin-bottom: 1rem;">
            <input type="text" id="new-tasktype-title" placeholder="Назва типу">
            <button class="btn" onclick="addTaskType()">+ Додати тип</button>
        </div>
        <div id="tasktypes-list" class="item-list"></div>
    </div>

    <!-- Лекції -->
    <div class="card">
        <h2>📝 Лекції та матеріали</h2>
        <div class="form-group">
            <label>Назва лекції:</label>
            <input type="text" id="lesson-title">
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>Дисципліна:</label>
                <select id="lesson-subject-select"></select>
            </div>
            <div class="form-group">
                <label>Тип роботи:</label>
                <select id="lesson-tasktype-select"></select>
            </div>
        </div>
        <div class="form-group">
            <label>Посилання на матеріали:</label>
            <input type="url" id="lesson-link">
        </div>
        <button class="btn" onclick="addLesson()">+ Додати матеріали</button>
        <div id="lessons-list" class="item-list" style="margin-top: 1.5rem;"></div>
    </div>

</div>

<div id="status-toast" class="status-toast"></div>

<script>
    const SANITY_PROJECT_ID = "uld9o5j2";
    const SANITY_DATASET = "production";
    const API_VERSION = "v2021-10-21";
    const API_BASE = `https://${SANITY_PROJECT_ID}.api.sanity.io/${API_VERSION}/data`;

    let currentPortfolioId = null;
    let subjects = [];
    let taskTypes = [];
    let lessons = [];

    function getToken() {
        return localStorage.getItem('sanity_admin_token') || document.getElementById('sanity-token').value.trim();
    }

    function saveTokenLocally() {
        const token = document.getElementById('sanity-token').value.trim();
        if (token) localStorage.setItem('sanity_admin_token', token);
    }

    function showToast(msg, isErr = false) {
        const toast = document.getElementById('status-toast');
        toast.textContent = msg;
        toast.style.backgroundColor = isErr ? 'var(--danger)' : 'var(--success)';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    async function sanityFetch(query) {
        const url = `${API_BASE}/query/${SANITY_DATASET}?query=${encodeURIComponent(query)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return data.result;
    }

    async function sanityMutate(mutations) {
        const token = getToken();
        if (!token) {
            showToast("Введіть Sanity API Token!", true);
            throw new Error("Missing Token");
        }
        const res = await fetch(`${API_BASE}/mutate/${SANITY_DATASET}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ mutations })
        });
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.message || 'Mutation Error');
        }
        return await res.json();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('sanity_admin_token');
        if (savedToken) document.getElementById('sanity-token').value = savedToken;
        loadAllData();
    });

    async function loadAllData() {
        try {
            const pList = await sanityFetch('*[_type == "portfolio"]');
            if (pList && pList.length > 0) {
                // Знаходимо заповнений документ
                const p = pList.find(item => item.name) || pList[0];
                currentPortfolioId = p._id; // Запам'ятовуємо справжній ID з бази

                document.getElementById('p-name').value = p.name || '';
                document.getElementById('p-role').value = p.role || '';
                document.getElementById('p-avatar').value = p.avatar || '';
                document.getElementById('p-contacts').value = p.contacts || '';
                document.getElementById('p-education').value = p.education || '';
                document.getElementById('p-interests').value = p.interests || '';
                if (p.disciplines) {
                    document.getElementById('p-disciplines').value = Array.isArray(p.disciplines) ? p.disciplines.join(', ') : p.disciplines;
                }
            }
        } catch (e) { console.error("Помилка портфоліо:", e); }

        try { subjects = (await sanityFetch('*[_type == "subject"]')) || []; renderSubjects(); } catch (e) {}
        try { taskTypes = (await sanityFetch('*[_type == "taskType"]')) || []; renderTaskTypes(); } catch (e) {}
        try { lessons = (await sanityFetch('*[_type == "lesson"]{..., subject->{_id, title}, taskType->{_id, title}}')) || []; renderLessons(); } catch (e) {}

        updateDropdowns();
    }

    async function savePortfolio() {
        const discRaw = document.getElementById('p-disciplines').value;
        const discArray = discRaw.split(',').map(s => s.trim()).filter(Boolean);

        const targetId = currentPortfolioId || 'teacher-portfolio';

        const doc = {
            _id: targetId,
            _type: 'portfolio',
            name: document.getElementById('p-name').value,
            role: document.getElementById('p-role').value,
            avatar: document.getElementById('p-avatar').value,
            contacts: document.getElementById('p-contacts').value,
            education: document.getElementById('p-education').value,
            interests: document.getElementById('p-interests').value,
            disciplines: discArray
        };

        try {
            await sanityMutate([{ createOrReplace: doc }]);
            showToast("Портфоліо збережено!");
            loadAllData();
        } catch (e) {
            showToast(`Помилка: ${e.message}`, true);
        }
    }

    function renderSubjects() {
        document.getElementById('subjects-list').innerHTML = subjects.map(s => `
            <div class="item-row">
                <span><b>${s.title || ''}</b></span>
                <button class="btn btn-danger" onclick="deleteItem('${s._id}')">Видалити</button>
            </div>
        `).join('');
    }

    async function addSubject() {
        const title = document.getElementById('new-subject-title').value.trim();
        if (!title) return;
        try {
            await sanityMutate([{ create: { _type: 'subject', title } }]);
            document.getElementById('new-subject-title').value = '';
            showToast("Додано!");
            loadAllData();
        } catch (e) { showToast(e.message, true); }
    }

    function renderTaskTypes() {
        document.getElementById('tasktypes-list').innerHTML = taskTypes.map(t => `
            <div class="item-row">
                <span><b>${t.title || ''}</b></span>
                <button class="btn btn-danger" onclick="deleteItem('${t._id}')">Видалити</button>
            </div>
        `).join('');
    }

    async function addTaskType() {
        const title = document.getElementById('new-tasktype-title').value.trim();
        if (!title) return;
        try {
            await sanityMutate([{ create: { _type: 'taskType', title } }]);
            document.getElementById('new-tasktype-title').value = '';
            showToast("Додано!");
            loadAllData();
        } catch (e) { showToast(e.message, true); }
    }

    function updateDropdowns() {
        document.getElementById('lesson-subject-select').innerHTML = subjects.map(s => `<option value="${s._id}">${s.title}</option>`).join('');
        document.getElementById('lesson-tasktype-select').innerHTML = taskTypes.map(t => `<option value="${t._id}">${t.title}</option>`).join('');
    }

    function renderLessons() {
        document.getElementById('lessons-list').innerHTML = lessons.map(l => `
            <div class="item-row">
                <div>
                    <strong>${l.title || ''}</strong> 
                    <small style="color: var(--text-muted)">(${l.subject?.title || '—'} / ${l.taskType?.title || '—'})</small>
                </div>
                <button class="btn btn-danger" onclick="deleteItem('${l._id}')">Видалити</button>
            </div>
        `).join('');
    }

    async function addLesson() {
        const title = document.getElementById('lesson-title').value.trim();
        const subjectId = document.getElementById('lesson-subject-select').value;
        const taskTypeId = document.getElementById('lesson-tasktype-select').value;
        const link = document.getElementById('lesson-link').value.trim();

        if (!title) return alert('Вкажіть назву');

        try {
            await sanityMutate([{
                create: {
                    _type: 'lesson',
                    title,
                    link,
                    subject: { _type: 'reference', _ref: subjectId },
                    taskType: { _type: 'reference', _ref: taskTypeId }
                }
            }]);
            document.getElementById('lesson-title').value = '';
            document.getElementById('lesson-link').value = '';
            showToast("Додано!");
            loadAllData();
        } catch (e) { showToast(e.message, true); }
    }

    async function deleteItem(id) {
        if (!confirm('Видалити цей елемент?')) return;
        try {
            await sanityMutate([{ delete: { id } }]);
            showToast("Видалено!");
            loadAllData();
        } catch (e) { showToast(e.message, true); }
    }
</script>

</body>
</html>
