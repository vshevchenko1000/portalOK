<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Опублікувати матеріал | Панель викладача</title>

		<!-- Подключение стилей Quill (Візуальний редактор з фото) -->
		<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />

		<style>
			:root {
				--deep-blue: #001b4c;
				--bright-blue: #00a3ff;
				--bg-color: #f8fafc;
				--card-bg: #ffffff;
				--text-main: #0f172a;
				--text-muted: #64748b;
				--border-color: #cbd5e1;
			}

			* { box-sizing: border-box; margin: 0; padding: 0; }

			body {
				font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
				background-color: var(--bg-color);
				color: var(--text-main);
				padding: 40px 20px;
			}

			.admin-container {
				max-width: 860px;
				margin: 0 auto;
				background: var(--card-bg);
				border-radius: 16px;
				padding: 32px;
				box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
				border: 1px solid #e2e8f0;
			}

			.form-header {
				font-size: 1.5rem;
				font-weight: 800;
				color: var(--deep-blue);
				margin-bottom: 24px;
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.form-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 20px;
				margin-bottom: 20px;
			}

			@media (max-width: 640px) {
				.form-grid { grid-template-columns: 1fr; }
			}

			.form-group {
				display: flex;
				flex-direction: column;
				gap: 8px;
				margin-bottom: 20px;
			}

			.form-group label {
				font-size: 0.92rem;
				font-weight: 700;
				color: var(--deep-blue);
			}

			.form-control {
				width: 100%;
				padding: 12px 16px;
				border: 2px solid var(--border-color);
				border-radius: 10px;
				font-size: 0.95rem;
				outline: none;
				transition: border-color 0.2s;
				background: #ffffff;
			}

			.form-control:focus {
				border-color: var(--bright-blue);
			}

			/* Стилізація редактора Quill */
			.ql-toolbar.ql-snow {
				border-top-left-radius: 10px;
				border-top-right-radius: 10px;
				border-color: var(--border-color) !important;
				background: #f8fafc;
			}

			.ql-container.ql-snow {
				border-bottom-left-radius: 10px;
				border-bottom-right-radius: 10px;
				border-color: var(--border-color) !important;
				min-height: 220px;
				font-size: 1rem;
				font-family: inherit;
			}

			.btn-submit {
				background: #00a3ff;
				color: white;
				border: none;
				padding: 14px 28px;
				font-size: 1rem;
				font-weight: 700;
				border-radius: 10px;
				cursor: pointer;
				display: inline-flex;
				align-items: center;
				gap: 10px;
				transition: all 0.2s ease;
				box-shadow: 0 4px 12px rgba(0, 163, 255, 0.25);
			}

			.btn-submit:hover {
				background: #008be0;
				transform: translateY(-2px);
				box-shadow: 0 6px 16px rgba(0, 163, 255, 0.35);
			}

			.btn-submit:disabled {
				background: #94a3b8;
				cursor: not-allowed;
				transform: none;
			}

			.token-box {
				background: #fffbebf5;
				border: 1px solid #fde68a;
				border-radius: 10px;
				padding: 14px;
				margin-bottom: 20px;
				font-size: 0.88rem;
				color: #92400e;
			}
		</style>
	</head>
	<body>

		<div class="admin-container">
			<div class="form-header">
				📝 4. Опублікувати матеріал
			</div>

			<!-- Поле для Sanity API Write Token -->
			<div class="token-box">
				<label style="font-weight:700; display:block; margin-bottom:4px;">🔑 Sanity Write Token (необхідний для запису):</label>
				<input type="password" id="sanityToken" class="form-control" placeholder="Введіть ваш Sanity API Token (sk...)" style="margin-top:4px; font-size:0.85rem;" />
				<span style="font-size: 0.78rem; opacity: 0.8;">Токен зберігається лише у вашому браузері під час сесії.</span>
			</div>

			<form id="publishForm" onsubmit="handlePublish(event)">
				<div class="form-grid">
					<div class="form-group">
						<label for="subjectSelect">Дисципліна:</label>
						<select id="subjectSelect" class="form-control" required>
							<option value="">Завантаження дисциплін...</option>
						</select>
					</div>

					<div class="form-group">
						<label for="taskTypeSelect">Тип завдання:</label>
						<select id="taskTypeSelect" class="form-control" required>
							<option value="">Завантаження типів...</option>
						</select>
					</div>
				</div>

				<div class="form-group">
					<label for="lessonTitle">Тема / Назва матеріалу:</label>
					<input type="text" id="lessonTitle" class="form-control" placeholder="Лекція 1. Вступ..." required />
				</div>

				<!-- Візуальний редактор з підключенням фотографій -->
				<div class="form-group">
					<label>Текст матеріалу (можна додавати фото, списки та форматування):</label>
					<div id="editor-container"></div>
				</div>

				<div class="form-group">
					<label for="fileUrl">Посилання на файл (Google Drive / PDF / Презентація):</label>
					<input type="url" id="fileUrl" class="form-control" placeholder="https://drive.google.com/..." />
				</div>

				<button type="submit" id="submitBtn" class="btn-submit">
					🚀 Опублікувати матеріал
				</button>
			</form>
		</div>

		<!-- Скрипт візуального редактора -->
		<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

		<script>
			const SANITY_PROJECT_ID = "uld9o5j2";
			const SANITY_DATASET = "production";

			// 1. Ініціалізація редактора Quill з можливістю додавання фото
			const quill = new Quill('#editor-container', {
				theme: 'snow',
				placeholder: 'Введіть навчальний матеріал або вставте фотографії...',
				modules: {
					toolbar: [
						[{ 'header': [1, 2, 3, false] }],
						['bold', 'italic', 'underline', 'strike'],
						[{ 'list': 'ordered'}, { 'list': 'bullet' }],
						['image', 'link'], // <--- Кнопка додавання фото та посилань
						['clean']
					]
				}
			});

			// 2. Автоматичне завантаження списку дисциплін та типів завдань із Sanity
			async function initFormData() {
				try {
					// Дисципліни
					const subRes = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "subject"]')}`);
					const subData = await subRes.json();
					const subSelect = document.getElementById('subjectSelect');
					subSelect.innerHTML = '<option value="">Оберіть дисципліну...</option>';
					(subData.result || []).forEach(sub => {
						subSelect.innerHTML += `<option value="${sub.title}">${sub.icon || ''} ${sub.title}</option>`;
					});

					// Типи завдань
					const ttRes = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "taskType"]')}`);
					const ttData = await ttRes.json();
					const ttSelect = document.getElementById('taskTypeSelect');
					ttSelect.innerHTML = '<option value="">Оберіть тип завдання...</option>';
					(ttData.result || []).forEach(tt => {
						ttSelect.innerHTML += `<option value="${tt.title}">${tt.title}</option>`;
					});

				} catch (err) {
					alert("Помилка завантаження даних із Sanity. Перевірте підключення.");
					console.error(err);
				}
			}

			// 3. Публікація лекції в Sanity
			async function handlePublish(event) {
				event.preventDefault();

				const token = document.getElementById('sanityToken').value.trim();
				if (!token) {
					alert("Будь ласка, введіть вашій Sanity API Token (з правами Write) у поле вгорі форми.");
					return;
				}

				const btn = document.getElementById('submitBtn');
				btn.disabled = true;
				btn.innerText = "⏳ Публікація...";

				// Отримуємо згенерований HTML-код (включаючи вставлені картинки)
				const contentHTML = quill.root.innerHTML;

				const doc = {
					_type: 'lesson',
					title: document.getElementById('lessonTitle').value.trim(),
					discipline: document.getElementById('subjectSelect').value,
					taskType: document.getElementById('taskTypeSelect').value,
					content: contentHTML,
					fileUrl: document.getElementById('fileUrl').value.trim()
				};

				const mutations = [{ create: doc }];

				try {
					const res = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${SANITY_DATASET}`, {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							'Authorization': `Bearer ${token}`
						},
						body: JSON.stringify({ mutations })
					});

					const result = await res.json();

					if (res.ok) {
						alert("🎉 Матеріал успішно опубліковано!");
						document.getElementById('publishForm').reset();
						quill.setContents([]);
					} else {
						alert(`Помилка: ${result.error ? result.error.description : 'Не вдалося опублікувати.'}`);
					}
				} catch (err) {
					alert("Помилка мережі при публікації.");
					console.error(err);
				} finally {
					btn.disabled = false;
					btn.innerText = "🚀 Опублікувати матеріал";
				}
			}

			document.addEventListener('DOMContentLoaded', initFormData);
		</script>
	</body>
</html>
