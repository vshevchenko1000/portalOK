<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель Sanity</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-primary { background: #2276fc; color: white; }
        .btn-danger { background: #e53935; color: white; }
        
        .materials-list {
            display: grid;
            gap: 12px;
            margin-top: 15px;
        }
        .material-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 12px 16px;
            border-radius: 6px;
        }
        .material-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .material-id {
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <!-- Секція авторизації -->
    <div class="card">
        <div class="form-group">
            <label for="sanityToken">🔑 Sanity Write Token (збережеться автоматично):</label>
            <input type="password" id="sanityToken" placeholder="sk..." autocomplete="off">
        </div>
    </div>

    <!-- Секція управління матеріалами -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📦 Матеріали</h2>
            <button class="btn-primary" onclick="loadMaterials()">🔄 Оновити список</button>
        </div>
        
        <div id="materialsContainer" class="materials-list">
            <p style="color: #666;">Завантаження...</p>
        </div>
    </div>

    <script>
        const PROJECT_ID = 'uld9o5j2';
        const DATASET = 'production';
        const API_VERSION = 'v2021-06-07';

        const tokenInput = document.getElementById('sanityToken');
        const container = document.getElementById('materialsContainer');

        // 1. Автозавантаження токена при відкритті сторінки
        document.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('sanityToken');
            if (savedToken) {
                tokenInput.value = savedToken;
            }
            loadMaterials();
        });

        // 2. Автозбереження токена в localStorage при введенні
        tokenInput.addEventListener('input', (e) => {
            const token = e.target.value.trim();
            localStorage.setItem('sanityToken', token);
        });

        // Отримання поточного токена
        function getToken() {
            return localStorage.getItem('sanityToken') || tokenInput.value.trim();
        }

        // 3. Завантаження списку матеріалів з Sanity
        async function loadMaterials() {
            const token = getToken();
            if (!token) {
                container.innerHTML = '<p style="color: #e53935;">⚠️ Введіть Sanity Write Token вище для доступу до даних.</p>';
                return;
            }

            container.innerHTML = '<p style="color: #666;">Завантажуємо матеріали...</p>';

            // GROQ запит (повертає всі документи з типом "material")
            const query = encodeURIComponent('*[_type == "material"]{ _id, title, name }');
            const url = `https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/query/${DATASET}?query=${query}`;

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.description || 'Помилка доступу до API');
                }

                renderMaterials(data.result || []);
            } catch (err) {
                container.innerHTML = `<p style="color: #e53935;">Помилка: ${err.message}</p>`;
            }
        }

        // 4. Відображення карток матеріалів
        function renderMaterials(items) {
            if (items.length === 0) {
                container.innerHTML = '<p style="color: #777;">Матеріалів не знайдено.</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="material-item" id="doc-${item._id}">
                    <div class="material-info">
                        <strong>${item.title || item.name || 'Без назви'}</strong>
                        <span class="material-id">ID: ${item._id}</span>
                    </div>
                    <button class="btn-danger" onclick="deleteMaterial('${item._id}')">🗑️ Видалити</button>
                </div>
            `).join('');
        }

        // 5. Функція видалення матеріалу
        async function deleteMaterial(documentId) {
            const token = getToken();
            if (!token) {
                alert('Помилка: Токен відсутній!');
                return;
            }

            if (!confirm('Ви впевнені, що хочете видалити цей матеріал?')) {
                return;
            }

            const url = `https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/mutate/${DATASET}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        mutations: [
                            { delete: { id: documentId } }
                        ]
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Видаляємо рядок з інтерфейсу без перезавантаження всієї сторінки
                    const element = document.getElementById(`doc-${documentId}`);
                    if (element) element.remove();
                    alert('Матеріал успішно видалено!');
                } else {
                    alert(`Помилка видалення: ${data.error?.description || 'Перевірте права токена'}`);
                }
            } catch (err) {
                console.error(err);
                alert('Не вдалося виконати мережевий запит.');
            }
        }
    </script>

</body>
</html>
