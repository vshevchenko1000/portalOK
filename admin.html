<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель Sanity</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
        }
        .form-group {
            margin: 0;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h2 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { 
            background: #2276fc; 
            color: white; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
        }

        .materials-list {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 🔑 Токен -->
    <div class="card">
        <div class="form-group">
            <label for="sanityToken">🔑 Sanity Write Token (збережеться автоматично):</label>
            <input type="password" id="sanityToken" placeholder="sk..." autocomplete="off">
        </div>
    </div>

    <!-- 📦 Матеріали -->
    <div class="card">
        <div class="header-row">
            <h2>📦 Матеріали</h2>
            <button class="btn-primary" onclick="loadMaterials()">🔄 Оновити список</button>
        </div>
        
        <div id="materialsContainer" class="materials-list">
            <p style="color: #888;">Завантаження...</p>
        </div>
    </div>

    <script>
        const PROJECT_ID = 'uld9o5j2';
        const DATASET = 'production';
        const API_VERSION = 'v2021-06-07';

        const tokenInput = document.getElementById('sanityToken');
        const container = document.getElementById('materialsContainer');

        document.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('sanityToken');
            if (savedToken) tokenInput.value = savedToken;
            loadMaterials();
        });

        tokenInput.addEventListener('input', (e) => {
            localStorage.setItem('sanityToken', e.target.value.trim());
        });

        function getToken() {
            return localStorage.getItem('sanityToken') || tokenInput.value.trim();
        }

        async function loadMaterials() {
            const token = getToken();
            if (!token) {
                container.innerHTML = '<p style="color: #e53935;">⚠️ Введіть Sanity Write Token вище для доступу.</p>';
                return;
            }

            container.innerHTML = '<p style="color: #888;">Завантаження...</p>';

            const query = encodeURIComponent('*[_type == "material"]{ _id, title, name }');
            const url = `https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/query/${DATASET}?query=${query}`;

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error?.description || 'Помилка API');

                renderMaterials(data.result || []);
            } catch (err) {
                container.innerHTML = `<p style="color: #e53935;">Помилка: ${err.message}</p>`;
            }
        }

        function renderMaterials(items) {
            if (items.length === 0) {
                container.innerHTML = '<p style="color: #888;">Матеріалів не знайдено.</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div style="padding: 10px 0; border-bottom: 1px solid #eee;">
                    <strong>${item.title || item.name || 'Без назви'}</strong>
                </div>
            `).join('');
        }
    </script>

</body>
</html>
