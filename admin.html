<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управління — ДФКР</title>
    <style>
        :root {
            --deep-blue: #001b4c;
            --bright-blue: #00a3ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .admin-container {
            max-width: 700px;
            margin: 20px auto;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--deep-blue);
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--deep-blue);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--bright-blue);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }

        .btn-save {
            background: var(--bright-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-save:hover {
            background: #008be6;
        }

        .btn-save:active {
            transform: scale(0.99);
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        .status-msg.success { background: #dcfce7; color: #15803d; }
        .status-msg.error { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>⚙️ Редагування Портфоліо Викладача</h1>
        
        <form id="portfolio-form">
            <div class="form-group">
                <label>ПІБ Викладача:</label>
                <input type="text" id="p-name" placeholder="Шевченко Владислав Ігорович" required>
            </div>

            <div class="form-group">
                <label>Посада / Статус:</label>
                <input type="text" id="p-role" placeholder="Викладач спецдисциплін">
            </div>

            <div class="form-group">
                <label>Аватар (Emoji):</label>
                <input type="text" id="p-avatar" placeholder="👨‍🏫" value="👨‍🏫">
            </div>

            <div class="form-group">
                <label>🎓 Освіта:</label>
                <textarea id="p-education" placeholder="Вкажіть навчальні заклади, спеціальність..."></textarea>
            </div>

            <div class="form-group">
                <label>🔬 Наукові інтереси:</label>
                <textarea id="p-interests" placeholder="Веб-технології, штучний інтелект..."></textarea>
            </div>

            <div class="form-group">
                <label>📚 Ключові дисципліни (через кому):</label>
                <input type="text" id="p-disciplines" placeholder="Веб-програмування, Бази даних, ООП">
                <div class="hint">Вказуйте назви через кому — вони перетворяться на красиві теги.</div>
            </div>

            <div class="form-group">
                <label>📬 Контакти:</label>
                <input type="text" id="p-contacts" placeholder="Email, Telegram або номер телефону">
            </div>

            <div class="form-group" style="border-top: 1px solid var(--border-color); padding-top: 15px;">
                <label>🔑 Sanity API Token (з правом запису):</label>
                <input type="text" id="p-token" placeholder="sk..." required>
                <div class="hint">Потрібен один раз для збереження змін у Sanity API.</div>
            </div>

            <button type="button" class="btn-save" onclick="savePortfolio()">💾 Зберегти зміни</button>
            <div id="status" class="status-msg"></div>
        </form>
    </div>

    <script>
        const SANITY_PROJECT_ID = "uld9o5j2";
        const SANITY_DATASET = "production";

        // Завантаження поточних даних із Sanity
        async function loadCurrentPortfolio() {
            try {
                const res = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "portfolio"][0]')}`);
                const data = await res.json();
                
                if (data.result) {
                    const p = data.result;
                    if(p.name) document.getElementById('p-name').value = p.name;
                    if(p.role) document.getElementById('p-role').value = p.role;
                    if(p.avatar) document.getElementById('p-avatar').value = p.avatar;
                    if(p.education) document.getElementById('p-education').value = p.education;
                    if(p.interests) document.getElementById('p-interests').value = p.interests;
                    if(p.disciplines) {
                        document.getElementById('p-disciplines').value = Array.isArray(p.disciplines) ? p.disciplines.join(', ') : p.disciplines;
                    }
                    if(p.contacts) document.getElementById('p-contacts').value = p.contacts;
                }
            } catch (err) {
                console.error("Помилка завантаження даних:", err);
            }
        }

        // Збереження оновлених даних
        async function savePortfolio() {
            const token = document.getElementById('p-token').value.trim();
            const statusEl = document.getElementById('status');

            if (!token) {
                showStatus('Будь ласка, вкажіть API Token для збереження!', 'error');
                return;
            }

            const disciplinesRaw = document.getElementById('p-disciplines').value;
            const disciplinesArray = disciplinesRaw.split(',').map(item => item.trim()).filter(item => item.length > 0);

            const docData = {
                _id: "teacherPortfolio",
                _type: "portfolio",
                name: document.getElementById('p-name').value,
                role: document.getElementById('p-role').value,
                avatar: document.getElementById('p-avatar').value,
                education: document.getElementById('p-education').value,
                interests: document.getElementById('p-interests').value,
                disciplines: disciplinesArray,
                contacts: document.getElementById('p-contacts').value
            };

            const mutations = [{
                createOrReplace: docData
            }];

            try {
                showStatus('Збереження...', '');
                const response = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${SANITY_DATASET}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ mutations })
                });

                if (response.ok) {
                    showStatus('✅ Успішно збережено! Оновіть головну сторінку.', 'success');
                } else {
                    const errData = await response.json();
                    showStatus(`Помилка збереження: ${errData.error ? errData.error.description : 'Перевірте токен'}`, 'error');
                }
            } catch (err) {
                showStatus('Помилка з\'єднання з сервером', 'error');
            }
        }

        function showStatus(msg, type) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = msg;
            statusEl.className = `status-msg ${type}`;
            statusEl.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', loadCurrentPortfolio);
    </script>
</body>
</html>
