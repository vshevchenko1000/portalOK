<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель Sanity</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="password"], input[type="text"], textarea, input[type="file"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { background: #2276fc; color: white; }
        .btn-success { background: #2e7d32; color: white; }
        .btn-danger { background: #e53935; color: white; }
        .btn-secondary { background: #757575; color: white; }

        .materials-list {
            display: grid;
            gap: 12px;
            margin-top: 15px;
        }
        .material-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 12px 16px;
            border-radius: 8px;
            gap: 15px;
        }
        .material-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
            flex-shrink: 0;
        }
        .material-info { flex-grow: 1; }
        .material-id { font-size: 11px; color: #888; display: block; margin-top: 2px; }
        .actions { display: flex; gap: 8px; }

        /* Модалка редагування */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <!-- 1. Налаштування авторизації та Sanity Schema -->
    <div class="card">
        <div class="form-group">
            <label for="sanityToken">🔑 Sanity Write Token (збережеться автоматично):</label>
            <input type="password" id="sanityToken" placeholder="sk..." autocomplete="off">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="docType">🏷️ Тип документа в Sanity (_type):</label>
            <input type="text" id="docType" value="material" placeholder="material або post або article">
            <small style="color: #666;">Змініть, якщо ваша схема в Sanity називається по-іншому (наприклад, <b>materials</b> чи <b>post</b>).</small>
        </div>
    </div>

    <!-- 2. Форма створення/додавання нового матеріалу -->
    <div class="card">
        <h2>➕ Додати новий матеріал</h2>
        <form id="addForm" onsubmit="createMaterial(event)">
            <div class="form-group">
                <label for="newTitle">Заголовок / Текст матеріалу:</label>
                <input type="text" id="newTitle" required placeholder="Введіть назву або текст...">
            </div>
            
            <div class="form-group">
                <label for="newImage">🖼️ Прикріпити фотографію:</label>
                <input type="file" id="newImage" accept="image/*">
            </div>

            <button type="submit" id="addBtn" class="btn-success">Опублікувати матеріал</button>
        </form>
    </div>

    <!-- 3. Список створених матеріалів -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📦 Наявні матеріали</h2>
            <button class="btn-primary" onclick="loadMaterials()">🔄 Оновити список</button>
        </div>
        
        <div id="materialsContainer" class="materials-list">
            <p style="color: #666;">Завантаження...</p>
        </div>
    </div>

    <!-- Модальне вікно для редагування -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>✏️ Редагувати матеріал</h3>
            <input type="hidden" id="editDocId">
            
            <div class="form-group">
                <label for="editTitle">Заголовок / Текст:</label>
                <input type="text" id="editTitle">
            </div>

            <div class="form-group">
                <label for="editImage">Замінити фотографію:</label>
                <input type="file" id="editImage" accept="image/*">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-secondary" onclick="closeModal()">Скасувати</button>
                <button class="btn-success" id="saveBtn" onclick="saveChanges()">Зберегти зміни</button>
            </div>
        </div>
    </div>

    <script>
        const PROJECT_ID = 'uld9o5j2';
        const DATASET = 'production';
        const API_VERSION = 'v2021-06-07';

        const tokenInput = document.getElementById('sanityToken');
        const docTypeInput = document.getElementById('docType');
        const container = document.getElementById('materialsContainer');
        let materialsData = [];

        // Ініціалізація
        document.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('sanityToken');
            if (savedToken) tokenInput.value = savedToken;

            const savedDocType = localStorage.getItem('sanityDocType');
            if (savedDocType) docTypeInput.value = savedDocType;

            loadMaterials();
        });

        tokenInput.addEventListener('input', (e) => localStorage.setItem('sanityToken', e.target.value.trim()));
        docTypeInput.addEventListener('input', (e) => {
            localStorage.setItem('sanityDocType', e.target.value.trim());
            loadMaterials();
        });

        function getToken() { return localStorage.getItem('sanityToken') || tokenInput.value.trim(); }
        function getDocType() { return docTypeInput.value.trim() || 'material'; }

        // Допоміжна функція завантаження зображення в Sanity Assets
        async function uploadImageAsset(file, token) {
            const url = `https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/assets/images/${DATASET}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': file.type, 'Authorization': `Bearer ${token}` },
                body: file
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.description || 'Помилка завантаження фото');
            return data.document._id;
        }

        // 1. Створення нового матеріалу
        async function createMaterial(e) {
            e.preventDefault();
            const token = getToken();
            if (!token) return alert('⚠️ Помилка: Введіть Sanity Write Token!');

            const title = document.getElementById('newTitle').value;
            const fileInput = document.getElementById('newImage');
            const addBtn = document.getElementById('addBtn');

            addBtn.disabled = true;
            addBtn.innerText = 'Публікація...';

            try {
                let doc = {
                    _type: getDocType(),
                    title: title
                };

                // Якщо прикріплено фото
                if (fileInput.files.length > 0) {
                    const assetId = await uploadImageAsset(fileInput.files[0], token);
                    doc.image = {
                        _type: 'image',
                        asset: { _type: 'reference', _ref: assetId }
                    };
                }

                // Запит на створення документа
                const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/mutate/${DATASET}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ mutations: [{ create: doc }] })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('✅ Матеріал успішно створено!');
                    document.getElementById('addForm').reset();
                    loadMaterials();
                } else {
                    alert(`Помилка: ${data.error?.description || 'Не вдалося створити'}`);
                }
            } catch (err) {
                alert(`Помилка: ${err.message}`);
            } finally {
                addBtn.disabled = false;
                addBtn.innerText = 'Опублікувати матеріал';
            }
        }

        // 2. Отримання списку матеріалів
        async function loadMaterials() {
            const token = getToken();
            if (!token) {
                container.innerHTML = '<p style="color: #e53935;">⚠️ Введіть Sanity Write Token вище для доступу.</p>';
                return;
            }

            container.innerHTML = '<p style="color: #666;">Завантажуємо матеріали...</p>';
            const currentType = getDocType();

            // GROQ запит
            const query = encodeURIComponent(`*[_type == "${currentType}"]{ _id, title, name, "imageUrl": image.asset->url }`);
            const url = `https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/query/${DATASET}?query=${query}`;

            try {
                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error?.description || 'Помилка API');

                materialsData = data.result || [];
                renderMaterials(materialsData);
            } catch (err) {
                container.innerHTML = `<p style="color: #e53935;">Помилка: ${err.message}</p>`;
            }
        }

        // 3. Відображення карток
        function renderMaterials(items) {
            if (items.length === 0) {
                container.innerHTML = `<p style="color: #777;">Матеріалів з типом "<b>${getDocType()}</b>" не знайдено.</p>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="material-item" id="doc-${item._id}">
                    ${item.imageUrl 
                        ? `<img src="${item.imageUrl}" class="material-preview" alt="Фото">` 
                        : `<div class="material-preview" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;">Без фото</div>`}
                    
                    <div class="material-info">
                        <strong>${item.title || item.name || 'Без назви'}</strong>
                        <span class="material-id">ID: ${item._id}</span>
                    </div>

                    <div class="actions">
                        <button class="btn-primary" onclick="openEditModal('${item._id}')">✏️ Edit</button>
                        <button class="btn-danger" onclick="deleteMaterial('${item._id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // 4. Редагування
        function openEditModal(id) {
            const item = materialsData.find(m => m._id === id);
            if (!item) return;

            document.getElementById('editDocId').value = id;
            document.getElementById('editTitle').value = item.title || item.name || '';
            document.getElementById('editImage').value = '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }

        async function saveChanges() {
            const token = getToken();
            const docId = document.getElementById('editDocId').value;
            const newTitle = document.getElementById('editTitle').value;
            const fileInput = document.getElementById('editImage');
            const saveBtn = document.getElementById('saveBtn');

            saveBtn.disabled = true;
            saveBtn.innerText = 'Збереження...';

            try {
                const patchSet = { title: newTitle };

                if (fileInput.files.length > 0) {
                    const assetId = await uploadImageAsset(fileInput.files[0], token);
                    patchSet.image = { _type: 'image', asset: { _type: 'reference', _ref: assetId } };
                }

                const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/mutate/${DATASET}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ mutations: [{ patch: { id: docId, set: patchSet } }] })
                });

                if (res.ok) {
                    alert('✅ Зміни збережено!');
                    closeModal();
                    loadMaterials();
                } else {
                    const data = await res.json();
                    alert(`Помилка: ${data.error?.description || 'Не вдалося оновити'}`);
                }
            } catch (err) {
                alert(`Помилка: ${err.message}`);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'Зберегти зміни';
            }
        }

        // 5. Видалення
        async function deleteMaterial(documentId) {
            const token = getToken();
            if (!confirm('Ви впевнені, що хочете видалити цей матеріал?')) return;

            try {
                const res = await fetch(`https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/mutate/${DATASET}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ mutations: [{ delete: { id: documentId } }] })
                });

                if (res.ok) {
                    const el = document.getElementById(`doc-${documentId}`);
                    if (el) el.remove();
                } else {
                    alert('Помилка при видаленні.');
                }
            } catch (err) {
                alert('Не вдалося виконати запит.');
            }
        }
    </script>
</body>
</html>
