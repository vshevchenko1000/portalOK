<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель Sanity</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
        }
        .form-group {
            margin: 0;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h2 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { background: #2276fc; color: white; }
        .btn-edit { background: #f0f4ff; color: #2276fc; border: 1px solid #d0e0ff; }
        .btn-danger { background: #ffebee; color: #e53935; border: 1px solid #ffcdd2; }

        .materials-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .material-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            background: #fafafa;
        }
        .material-title {
            font-weight: 500;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- 🔑 Токен -->
    <div class="card">
        <div class="form-group">
            <label for="sanityToken">🔑 Sanity Write Token (збережеться автоматично):</label>
            <input type="password" id="sanityToken" placeholder="sk..." autocomplete="off">
        </div>
    </div>

    <!-- 📦 Матеріали -->
    <div class="card">
        <div class="header-row">
            <h2>📦 Матеріали</h2>
            <button class="btn-primary" onclick="loadMaterials()">🔄 Оновити список</button>
        </div>
        
        <div id="materialsContainer" class="materials-list">
            <p style="color: #888;">Завантаження...</p>
        </div>
    </div>

    <script>
        const PROJECT_ID = 'uld9o5j2';
        const DATASET = 'production';
        const API_VERSION = 'v2021-06-07';

        const tokenInput = document.getElementById('sanityToken');
        const container = document.getElementById('materialsContainer');

        // Автозавантаження та збереження токена
        document.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('sanityToken');
            if (savedToken) tokenInput.value = savedToken;
            loadMaterials();
        });

        tokenInput.addEventListener('input', (e) => {
            localStorage.setItem('sanityToken', e.target.value.trim());
        });

        function getToken() {
            return localStorage.getItem('sanityToken') || tokenInput.value.trim();
        }

        // 1. Отримання матеріалів з Sanity
        async function loadMaterials() {
            const token = getToken();
            if (!token) {
                container.innerHTML = '<p style="color: #e53935;">⚠️ Введіть Sanity Write Token вище для доступу.</p>';
                return;
            }

            container.innerHTML = '<p style="color: #888;">Завантаження...</p>';

            const query = encodeURIComponent('*[_type == "material"]{ _id, title, name }');
            const url = `https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/query/${DATASET}?query=${query}`;

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error?.description || 'Помилка API');

                renderMaterials(data.result || []);
            } catch (err) {
                container.innerHTML = `<p style="color: #e53935;">Помилка: ${err.message}</p>`;
            }
        }

        // 2. Відображення карток матеріалів
        function renderMaterials(items) {
            if (items.length === 0) {
                container.innerHTML = '<p style="color: #888;">Матеріалів не знайдено.</p>';
                return;
            }

            container.innerHTML = items.map(item => {
                const text = item.title || item.name || 'Без назви';
                // Екрануємо лапки для передачі в onclick
                const safeText = text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                return `
                    <div class="material-item" id="doc-${item._id}">
                        <span class="material-title" id="title-${item._id}">${text}</span>
                        <div class="actions">
                            <button class="btn-edit" onclick="editText('${item._id}', '${safeText}')">✏️ Редагувати</button>
                            <button class="btn-danger" onclick="deleteMaterial('${item._id}')">🗑️ Видалити</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 3. Редагування тексту матеріалу
        async function editText(documentId, currentText) {
            const token = getToken();
            if (!token) return alert('Помилка: Токен відсутній!');

            const newText = prompt('Введіть новий текст для матеріалу:', currentText);
            
            // Якщо натиснули Скасувати або залишили порожнім
            if (newText === null || newText.trim() === '' || newText === currentText) return;

            const url = `https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/mutate/${DATASET}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        mutations: [
                            {
                                patch: {
                                    id: documentId,
                                    set: { title: newText }
                                }
                            }
                        ]
                    })
                });

                if (response.ok) {
                    // Оновлюємо текст прямо на сторінці
                    const textEl = document.getElementById(`title-${documentId}`);
                    if (textEl) textEl.textContent = newText;
                } else {
                    const data = await response.json();
                    alert(`Помилка оновлення: ${data.error?.description || 'Перевірте токен'}`);
                }
            } catch (err) {
                alert('Не вдалося виконати запит.');
            }
        }

        // 4. Видалення матеріалу
        async function deleteMaterial(documentId) {
            const token = getToken();
            if (!token) return alert('Помилка: Токен відсутній!');

            if (!confirm('Ви впевнені, що хочете видалити цей матеріал?')) return;

            const url = `https://${PROJECT_ID}.api.sanity.io/${API_VERSION}/data/mutate/${DATASET}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        mutations: [
                            { delete: { id: documentId } }
                        ]
                    })
                });

                if (response.ok) {
                    const element = document.getElementById(`doc-${documentId}`);
                    if (element) element.remove();
                } else {
                    const data = await response.json();
                    alert(`Помилка видалення: ${data.error?.description || 'Перевірте токен'}`);
                }
            } catch (err) {
                alert('Не вдалося виконати запит.');
            }
        }
    </script>

</body>
</html>
